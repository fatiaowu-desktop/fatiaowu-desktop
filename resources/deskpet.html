<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>发条屋 · 桌面小鲸鱼</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   发条屋「放生」层 —— 桌面小鲸鱼
   它不住在发条屋窗口里，它住在**桌面**上：一块覆盖全屏的透明无边框浮层。
   原生侧（main.swift → DeskPetController）负责窗口与穿透，这里只管画它、
   让它活、接住你扔过来的东西。

   ── 造型（2026-09-21 重做）─────────────────────────────────────────────
   旧版是「一条品牌 logo 路径复制 9 份做渐变着色」：全身焊成一块，尾巴、
   胸鳍、眼睛都不是独立部件，所以它只能整体平移＋旋转 —— 本质是贴在屏幕
   上滑动的贴纸，不可能「游」。新版拆成**有骨骼的活物**：
       尾鳍  → 绕尾根独立摆动（二次谐波去机械感）
       胸鳍  → 独立拍打，相位与尾巴错开（overlapping action）
       身体  → 呼吸缩放 + 速度驱动的挤压拉伸（squash & stretch）
       脸    → 视线可转、可眨眼、吃东西时张嘴
   三款造型（圆胖幼鲸 / 虎鲸 / 海豚）共用同一套骨骼，只有路径数据不同。

   ── 三条不变量（改这个文件前先读）──────────────────────────────────────
   ① 着色层必须排在底色之后 —— SVG 按文档顺序绘制，底板不透明，顺序错了
      明暗肚白全被盖住，屏幕上只剩一块平色。
   ② 每个 path 必须显式给 fill —— SVG path 默认黑填充，漏一条 = 整只变黑。
   ③ 数字进 transform 之前必须过 num() —— rotate(NaNdeg) 会被 CSSOM 静默
      丢弃，不抛异常、style 属性保持空，肉眼与 DOM 都查不出来（历史血案）。

   ── 动作四条（2026-09-22「活鱼」一轮，改动画前先读）──────────────────────
   ④ 朝向必须**带滞回**：垂直游动时 heading→±90°、cos≈0，每帧现算会让身体在
      ±1 之间逐帧抽搐。只在 |vx|>26 时才允许改 P.face。
   ⑤ 屏幕空间的旋转（俯仰/侧倾）一律 **×(±1)**：rollEl 是 rotate(A) scaleX(s)，
      先镜像后旋转，不乘 flip 会把"下潜"画成"抬头"。
   ⑥ 摆浪必须挂在**同一个变换层级**里（bendG 包住尾鳍+身体）：分层旋转会在尾根
      留下 3~4px 的错位台阶。
   ⑦ 怠速频率 ≤0.6Hz —— 活物静止时几乎不动；超过 1Hz 就读成「抽搐」。
   ───────────────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
/* 皮肤变量只定义在 :root 上。**不要**写成 `html, body { --ft-accent: ... }` ——
   那样 body 自己持有一份，JS 往 documentElement 上写 inline 变量会被 body 自身的
   规则盖住，换肤时鲸鱼不变色（本文件第一版就踩了，换肤门当场红）。 */
:root {
  /* 默认皮肤：暗金·深夜。原生侧启动后会用 ftSetSkin 覆盖 */
  --ft-accent: #d9a441;
  --ft-accent-strong: #e6b95a;
  --ft-accent-soft: rgba(217, 164, 65, .5);
  --ft-accent-softer: rgba(217, 164, 65, .35);
  --ft-accent-bg: rgba(217, 164, 65, .08);
  --ft-pet-ink: #232733;
  --ft-pet-belly: #f7ead0;
}
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: transparent; overflow: hidden;
  -webkit-user-select: none; user-select: none;
  font-family: -apple-system, "PingFang SC", Helvetica, sans-serif;
}

/* ── 桌面层：默认整层穿透，只有鲸鱼自己接事件 ──────────────────────────
   pointer-events:none 是「网页内部」的穿透；窗口级的穿透由原生侧
   ignoresMouseEvents 轮询切换负责。两层都要，缺一层就漏。 */
#ft-pet-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

#ft-pet {
  position: absolute; left: 0; top: 0; width: 138px; height: 121px;
  pointer-events: auto; cursor: grab; will-change: transform;
  opacity: .94; transition: opacity .35s ease;
}
#ft-pet:hover { opacity: 1; }
#ft-pet[data-mood="drag"] { cursor: grabbing; opacity: 1; }
#ft-pet[data-mood="asleep"] { opacity: .58; }
#ft-pet[data-mood="dead"] { opacity: .92; }
#ft-pet[data-mood="eat"] { opacity: 1; }

#ft-pet-shadow {
  position: absolute; left: 50%; top: 100%; width: 84px; height: 15px;
  margin: -7px 0 0 -42px; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.24) 44%, rgba(0,0,0,0) 72%);
  filter: blur(2px); pointer-events: none; transform-origin: 50% 50%;
}
/* ── 呼吸辉光（2.24.0）：鱼身外一圈皮肤色柔光，opacity 由 render 按呼吸相位逐帧给 ──
   为什么不给下面那条 drop-shadow 直接加关键帧：drop-shadow 是**滤镜**，每帧改它等于
   每帧重算整只鱼的滤镜 → 重绘；那正是刚压下去的那笔开销，不能反悔。
   这里是一个独立的柔光层：静态画一次（radial-gradient + blur），之后只由合成器调透明度，
   不重绘、不动盒子（所以也不可能重演「伪元素外扩污染滚动溢出」那次事故）。 */
#ft-pet-halo {
  position: absolute; inset: -10px; border-radius: 50%;
  background: radial-gradient(ellipse 50% 33% at 50% 58%, var(--ft-accent-soft) 0%, rgba(255,255,255,0) 72%);
  filter: blur(7px); opacity: 0; pointer-events: none;
  will-change: opacity;
}
#ft-pet-lift { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 50%;
  filter: drop-shadow(0 3px 10px rgba(0,0,0,.36)) drop-shadow(0 0 8px var(--ft-accent-bg)); }
#ft-pet-squash { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 80%; }
#ft-pet-roll { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 54%; }
#ft-pet svg { display: block; overflow: visible; }

/* ── 鲸鱼本体着色 ───────────────────────────────────────────────────────
   纯色分层（赛璐璐），不是渐变 —— 动画片就是这么画的，硬边是特性不是缺陷。
   color-mix 用来从皮肤色派生亮/暗两档；不支持时退回 --ft-accent-strong。 */
.ft-pet-body  { fill: var(--ft-accent); }
.ft-pet-clipshape { fill: #000; }
.ft-pet-fill  { fill: var(--ft-accent); }
.ft-pet-lit   { fill: var(--ft-accent-strong); fill: color-mix(in srgb, var(--ft-accent) 80%, #fff); }
.ft-pet-dark  { fill: rgba(0, 0, 0, .17); }
.ft-pet-belly { fill: var(--ft-pet-belly); }
.ft-pet-sheen { fill: rgba(255, 255, 255, .30); }
.ft-pet-patch { fill: var(--ft-pet-belly); }
/* 幼鲸腮红（幼态身份证）：一朵淡玫瑰贴在嘴角上方，只由 calf 的 blush 参数触发 */
.ft-pet-blush { fill: rgba(226, 116, 116, .38); }
/* 海豚背影（计数阴影身份证）：背部分割线以上压一层冷调暗影，背深腹浅 */
.ft-pet-back  { fill: rgba(30, 44, 62, .20); }
/* 熊猫背甲（twoTone style:'ink'）：实墨色肩带，分界线以下留白肚 */
.ft-pet-back-ink { fill: var(--ft-pet-ink); }
/* 熊猫款（calf）：鳍/尾/背鳍吃墨色，眼白垫底——黑眼罩上黑瞳孔才看得见 */
.ft-pet-ink-fill { fill: var(--ft-pet-ink); }
.ft-pet-sclera  { fill: #fdfdfd; }
.ft-pet-tail  { filter: brightness(.84) saturate(1.06); }
.ft-pet-fin   { filter: brightness(.9) saturate(1.04); }
/* 远侧（身体另一侧）那片：**更暗**。侧视里它是背光的那一侧，同色会读成
   "两片一样的鳍并排"，压暗 + 略降饱和才有前后层次。 */
.ft-pet-fin-far { filter: brightness(.68) saturate(.80); }
.ft-pet-pupil { fill: var(--ft-pet-ink); }
.ft-pet-glint, .ft-pet-glint2 { fill: #fff; }
.ft-pet-glint2 { opacity: .6; }
.ft-pet-mouth-fill { fill: var(--ft-pet-ink); }
.ft-pet-mouth-line { fill: none; stroke: var(--ft-pet-ink); stroke-linecap: round; }
.ft-pet-mouth-open { fill: var(--ft-pet-ink); display: none; }
#ft-pet[data-mouth="open"] .ft-pet-mouth-open { display: block; }
#ft-pet[data-mouth="open"] .ft-pet-mouth-line,
#ft-pet[data-mouth="open"] .ft-pet-mouth-fill { display: none; }
#ft-pet:hover .ft-pet-body { filter: drop-shadow(0 2px 6px rgba(0,0,0,.34)) drop-shadow(0 0 9px var(--ft-accent-soft)); }

/* ── 机械涂装（data-look="mech"） ─────────────────────────────────────────
   由皮肤声明 `--ft-look: mech` 驱动（原生 extractSkinVars 抽出来推给页面），
   也可以被原生单独推（以后加菜单项用）。几何由 build() 里注入的
   #ft-pet-mech 零件提供；这里只管**着色**：金属分层 + 青缝 + 冷铆钉。
   全部走 fill/stroke/opacity，无 filter 逐帧、无新盒子 → 零布局代价。 */
#ft-pet[data-look="mech"] .ft-pet-body  { fill: url(#ft-pet-metal); stroke: rgba(0,0,0,.55); stroke-width: 1.1; }
#ft-pet[data-look="mech"] .ft-pet-fill  { fill: url(#ft-pet-metal); stroke: rgba(0,0,0,.45); stroke-width: 1; }
#ft-pet[data-look="mech"] .ft-pet-lit   { fill: #eaf2f9; opacity: .44; }
#ft-pet[data-look="mech"] .ft-pet-belly { fill: #7a8794; opacity: .85; }
#ft-pet[data-look="mech"] .ft-pet-dark  { fill: rgba(0,0,0,.36); }
#ft-pet[data-look="mech"] .ft-pet-sheen { fill: rgba(255,255,255,.55); }
#ft-pet[data-look="mech"] .ft-pet-tail  { filter: brightness(.88); }
#ft-pet[data-look="mech"] .ft-pet-fin   { filter: brightness(.96); }
#ft-pet[data-look="mech"] .ft-pet-fin-far { filter: brightness(.6) saturate(.7); }
#ft-pet[data-look="mech"] .ft-pet-mouth-fill { fill: rgba(0,0,0,.5); }
/* 眼睛 → 环形传感器：深瞳 + 青环 + 青光点 */
#ft-pet[data-look="mech"] .ft-pet-pupil  { fill: #060f13; stroke: var(--ft-accent); stroke-width: 1.4; }
#ft-pet[data-look="mech"] .ft-pet-glint  { fill: var(--ft-accent); }
#ft-pet[data-look="mech"] .ft-pet-glint2 { fill: var(--ft-accent); opacity: .5; }
/* 零件：板缝（发光细线）/ 铆钉（冷金属点）/ 格栅（压暗短缝）/ 镜头环 */
#ft-pet[data-look="mech"] .ft-pet-seam   { fill: none; stroke: var(--ft-accent); stroke-width: 1.3; stroke-linecap: round; opacity: .85; }
#ft-pet[data-look="mech"] .ft-pet-rivet  { fill: #c2ccd8; }
#ft-pet[data-look="mech"] .ft-pet-grille { fill: none; stroke: rgba(0,0,0,.4); stroke-width: 1.6; stroke-linecap: round; }
#ft-pet[data-look="mech"] .ft-pet-lens   { fill: none; stroke: var(--ft-accent); stroke-width: 1.6; opacity: .9; }
/* 零件只在机械涂装下出现（属性缺失也算非 mech） */
#ft-pet:not([data-look="mech"]) #ft-pet-mech,
#ft-pet:not([data-look="mech"]) .ft-pet-turbine,
#ft-pet:not([data-look="mech"]) .ft-pet-seam,
#ft-pet:not([data-look="mech"]) .ft-pet-rivet,
#ft-pet:not([data-look="mech"]) .ft-pet-grille,
#ft-pet:not([data-look="mech"]) .ft-pet-lens { display: none; }
/* ── 河道之灵（data-breed="clockwork"）：灵体涂装 ────────────────────────
   王者「河道之灵」的读法：半透明灵体 + 亮边 + 莲冠 + 光点 + 水波纹。
   **全矢量 + CSS 动效**。原先的 AI 位图分层（v1~v3）已整体删除：那套素材的
   尾片/鳍片切弧圆心与旋转枢轴不同心（实测 476.5 / 416.6 / 442.5 三个心），
   只要摆动就必然撕开金色尖刺与缺口 —— 位图方案的原生病，删掉才是真修好。
   颜色一律走 currentColor（CSS 变量写进 SVG 属性不生效，见 build() 注释）。 */
#ft-pet[data-breed="clockwork"] { color: var(--ft-accent); }
#ft-pet[data-breed="clockwork"] .ft-pet-body,
#ft-pet[data-breed="clockwork"] .ft-pet-fill {
  fill: url(#ft-spirit-body);
  stroke: url(#ft-spirit-rim);
  stroke-width: 1.5;
  filter: drop-shadow(0 0 7px var(--ft-accent-soft));
}
#ft-pet[data-breed="clockwork"] .ft-pet-lit   { fill: #fff; opacity: .20; }
#ft-pet[data-breed="clockwork"] .ft-pet-dark  { fill: rgba(2, 20, 34, .09); }
#ft-pet[data-breed="clockwork"] .ft-pet-belly { fill: #f2feff; opacity: .36; }
#ft-pet[data-breed="clockwork"] .ft-pet-sheen { fill: #fff; opacity: .5; }
#ft-pet[data-breed="clockwork"] .ft-pet-patch { fill: #eafcff; opacity: .35; }
#ft-pet[data-breed="clockwork"] .ft-pet-tail  { filter: brightness(1.14) saturate(1.05); opacity: .80; }
#ft-pet[data-breed="clockwork"] .ft-pet-fin   { filter: brightness(1.18) saturate(1.05); opacity: .78; }
#ft-pet[data-breed="clockwork"] .ft-pet-fin-far { filter: brightness(.80) saturate(.85); opacity: .55; }
#ft-pet[data-breed="clockwork"] .ft-pet-mouth-fill { fill: rgba(4, 34, 48, .55); }
#ft-pet[data-breed="clockwork"] .ft-pet-pupil { fill: #062330; }
/* 灵体组件只在河道之灵档显形（其余造型走矢量骨架鲸，各档分工明确） */
#ft-pet:not([data-breed="clockwork"]) #ft-spirit-back,
#ft-pet:not([data-breed="clockwork"]) #ft-spirit-front { display: none; }
/* 动效只用 transform / opacity（零布局代价）。
   ⚠️ transform-box: view-box 必须显式写 —— 否则 transform-origin 的解释基准
      在 WebKit 与 Blink 之间不一致，会绕错点转（SVG 动画的老坑）。 */
#ft-spirit-aura    { transform-box: view-box; transform-origin: 82px -4px; animation: ft-spirit-aura 4.8s ease-in-out infinite; }
#ft-spirit-ripple1 { transform-box: view-box; transform-origin: 82px 34px; animation: ft-spirit-ripple 3.8s ease-out infinite; }
#ft-spirit-ripple2 { transform-box: view-box; transform-origin: 82px 34px; animation: ft-spirit-ripple 3.8s ease-out infinite; animation-delay: 1.9s; }
#ft-spirit-lotus   { transform-box: view-box; transform-origin: 112px 24px; animation: ft-spirit-lotus 4.2s ease-in-out infinite; }
.ft-spirit-mote    { animation: ft-spirit-mote 4.4s ease-in-out infinite; }
@keyframes ft-spirit-aura {
  0%, 100% { opacity: .50; transform: scale(1); }
  50%      { opacity: .78; transform: scale(1.06); }
}
@keyframes ft-spirit-ripple {
  0%   { opacity: .45; transform: scale(.82); }
  100% { opacity: 0;   transform: scale(1.22); }
}
@keyframes ft-spirit-lotus {
  0%, 100% { transform: rotate(-3.5deg); }
  50%      { transform: rotate(3.5deg); }
}
@keyframes ft-spirit-mote {
  0%   { opacity: 0;   transform: translateY(7px) scale(.9); }
  25%  { opacity: .95; }
  100% { opacity: 0;   transform: translateY(-22px) scale(1.05); }
}
@media (prefers-reduced-motion: reduce) {
  #ft-spirit-aura, #ft-spirit-ripple1, #ft-spirit-ripple2,
  #ft-spirit-lotus, .ft-spirit-mote { animation: none !important; }
}
/* 机械档：装甲自带镜头眼 → 藏掉骨架的卡通眼与高光 */
#ft-pet[data-look="mech"] .ft-pet-pupil,
#ft-pet[data-look="mech"] .ft-pet-glint,
#ft-pet[data-look="mech"] .ft-pet-glint2 { display: none; }
#ft-pet[data-look="mech"] #ft-pet-eye { display: none; }   /* faceG 里的整只眼（含白眼 #ft-pet-sclera）在图之上 */

/* ── 河道之灵 × 机械涂装皮肤 ────────────────────────────────────────────
   赛博·离子等皮肤会声明 `--ft-look: mech`，于是骨架套上金属装甲、
   并且把卡通眼藏掉（机械档自带镜头眼）。但河道之灵是**灵体**：
   不该被加装甲，眼睛也不该消失。多带一个属性选择器抬特异性 + !important，
   免得再被文件顺序左右（这条排在 mech 规则之后）。 */
#ft-pet[data-breed="clockwork"][data-look] #ft-pet-eye,
#ft-pet[data-breed="clockwork"][data-look] .ft-pet-pupil,
#ft-pet[data-breed="clockwork"][data-look] .ft-pet-glint,
#ft-pet[data-breed="clockwork"][data-look] .ft-pet-glint2 { display: inline !important; }
#ft-pet[data-breed="clockwork"][data-look] #ft-pet-mech,
#ft-pet[data-breed="clockwork"][data-look] .ft-pet-turbine,
#ft-pet[data-breed="clockwork"][data-look] .ft-pet-seam,
#ft-pet[data-breed="clockwork"][data-look] .ft-pet-rivet,
#ft-pet[data-breed="clockwork"][data-look] .ft-pet-grille,
#ft-pet[data-breed="clockwork"][data-look] .ft-pet-lens { display: none !important; }

/* ── 头顶气泡：它的「输出」不进聊天流，直接浮在你桌面上 ───────────────── */
.ft-dp-bubble {
  position: absolute; max-width: 360px; padding: 10px 13px;
  border-radius: 13px; border: 1px solid var(--ft-accent-softer);
  background: rgba(20, 24, 34, .93);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
  color: #e9edf5; font-size: 12.5px; line-height: 1.62;
  pointer-events: none; opacity: 0;
  animation: ft-dp-bubble-in .26s cubic-bezier(.22,1.1,.4,1) forwards;
}
.ft-dp-bubble[data-light="1"] { background: rgba(255,255,255,.96); color: #1e2330; box-shadow: 0 10px 28px rgba(20,30,50,.22); }
.ft-dp-bubble::after {
  content: ""; position: absolute; left: 26px; bottom: -6px; width: 10px; height: 10px;
  background: inherit; border-right: 1px solid var(--ft-accent-softer);
  border-bottom: 1px solid var(--ft-accent-softer); transform: rotate(45deg);
}
.ft-dp-bubble[data-fade="1"] { animation: ft-dp-bubble-out .5s ease forwards; }
@keyframes ft-dp-bubble-in  { 0% { opacity: 0; transform: translateY(8px) scale(.94); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes ft-dp-bubble-out { 0% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.ft-dp-bubble-title { font-weight: 500; font-size: 12.5px; margin-bottom: 3px; color: var(--ft-accent); }
.ft-dp-bubble[data-light="1"] .ft-dp-bubble-title { color: var(--ft-accent); }
.ft-dp-bubble-sub { font-size: 11px; color: #98a1b4; margin-bottom: 6px; }
.ft-dp-bubble[data-light="1"] .ft-dp-bubble-sub { color: #7c869a; }
/* 工作哨兵的气泡（2.24.0）：同视觉，只加一道强调色细边把「正事」与「闲话」分开。
   刻意不做成可点的样子 —— 浮层全穿透，气泡本来就点不到，别诱导用户去点。 */
.ft-dp-work { border-left: 2px solid var(--ft-accent-soft); }
.ft-dp-bubble-body {
  font-size: 12px; white-space: pre-wrap; word-break: break-word;
  max-height: 190px; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 74%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 74%, transparent 100%);
}
.ft-dp-bubble-body img { display: block; max-width: 100%; border-radius: 8px; }

/* ── 麦克风 chip（2.19.0 鱼对答）：贴鱼正下方的小玻璃胶囊，随鱼游动 ──────
   idle 一枚话筒 + 「对答」二字；listening 变波形条（高度由电平驱动）；
   thinking 三粒呼吸点。点击=开始/取消，位置随鱼但不算鱼身（碰撞用不到它）。 */
.ft-dp-mic {
  position: absolute; height: 24px; padding: 0 10px; border-radius: 12px;
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--ft-accent-softer);
  background: rgba(20, 24, 34, .82);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  color: var(--ft-accent); font-size: 10.5px; letter-spacing: 2px;
  cursor: pointer; pointer-events: auto; opacity: 0; transition: opacity .3s;
  user-select: none; -webkit-user-select: none;
}
.ft-dp-mic[data-on="1"] { opacity: 1; }
.ft-dp-mic[data-light="1"] { background: rgba(255, 255, 255, .9); }
.ft-dp-mic svg { flex: none; width: 11px; height: 11px; display: block; }
.ft-dp-mic > i { display: none; width: 2.5px; border-radius: 1.5px; background: var(--ft-accent); height: 9px; transition: height .08s linear; }
.ft-dp-mic-label { line-height: 1; padding-top: 1px; }
.ft-dp-mic[data-state="listening"] {
  border-color: var(--ft-accent-soft);
  box-shadow: 0 0 12px var(--ft-accent-softer);
}
.ft-dp-mic[data-state="listening"] .ft-dp-mic-label { display: none; }
.ft-dp-mic[data-state="listening"] > i { display: block; }
.ft-dp-mic-dots { display: none; align-items: center; gap: 2.5px; }
.ft-dp-mic[data-state="thinking"] .ft-dp-mic-label { display: none; }
.ft-dp-mic[data-state="thinking"] .ft-dp-mic-dots { display: flex; }
.ft-dp-mic-dots i {
  display: block; width: 3px; height: 3px; border-radius: 50%; background: var(--ft-accent);
  animation: ft-dp-mic-dot 1s ease-in-out infinite;
}
.ft-dp-mic-dots i:nth-child(2) { animation-delay: .18s; }
.ft-dp-mic-dots i:nth-child(3) { animation-delay: .36s; }
@keyframes ft-dp-mic-dot { 0%, 100% { opacity: .22; } 50% { opacity: 1; } }

/* ── 长按轮盘（2.20.0 / 2.21.5 苹果玻璃重制）：按住鱼身 850ms 呼出四项 ─────
   苹果毛玻璃三件套：低透暗底 + 大半径 blur+saturate、白色发丝描边、
   内嵌顶缘高光 + 外抛软阴影。弹出 = 四片从鱼心飞出（回弹曲线+阶梯延迟）；
   收起 = 全体无延迟快速吸回（open 的 delay 只写在 [data-on] 态，closed 态为 0）。 */
.ft-dp-wheel {
  position: absolute; width: 0; height: 0; pointer-events: none;
  opacity: 0; transition: opacity .14s ease-in;
}
.ft-dp-wheel[data-on="1"] { opacity: 1; transition: opacity .2s ease-out; }
.ft-dp-wheel-item {
  position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px;
  border-radius: 50%; pointer-events: auto; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 1px solid rgba(255, 255, 255, .16);
  background: rgba(28, 30, 40, .36);
  -webkit-backdrop-filter: blur(22px) saturate(1.7); backdrop-filter: blur(22px) saturate(1.7);
  box-shadow: 0 6px 22px rgba(0, 0, 0, .38),
              inset 0 1px 0 rgba(255, 255, 255, .22),
              inset 0 -1px 0 rgba(255, 255, 255, .05);
  /* 字/图标固定白（浅色态见 data-light），不跟皮肤 accent 走（2026-09-22 用户定） */
  color: #fff;
  /* closed 态：向鱼心收缩 70% 并缩小 —— 弹出时从鱼心飞出，收起时吸回 */
  transform: translate(calc(var(--wx, 0px) * -0.7), calc(var(--wy, 0px) * -0.7)) scale(.25);
  opacity: 0; visibility: hidden;
  transition: transform .16s cubic-bezier(.4, 0, .8, .6), opacity .13s ease-in,
              border-color .15s, background .15s, visibility 0s linear .18s;
  user-select: none; -webkit-user-select: none;
}
.ft-dp-wheel[data-on="1"] .ft-dp-wheel-item {
  transform: translate(0, 0) scale(1); opacity: 1; visibility: visible;
  transition: transform .46s cubic-bezier(.26, 1.52, .48, 1), opacity .2s ease-out,
              border-color .15s, background .15s;
}
/* 弹出阶梯：聊天→回笼→上岛→换肤 依次飞出；收起时这些 delay 不生效（closed 态无 delay） */
.ft-dp-wheel[data-on="1"] .ft-dp-wheel-item:nth-child(2) { transition-delay: 45ms; }
.ft-dp-wheel[data-on="1"] .ft-dp-wheel-item:nth-child(3) { transition-delay: 90ms; }
.ft-dp-wheel[data-on="1"] .ft-dp-wheel-item:nth-child(4) { transition-delay: 135ms; }
.ft-dp-wheel-item:hover {
  border-color: rgba(255, 255, 255, .34);
  background: rgba(66, 70, 90, .46);
}
.ft-dp-wheel-item svg { width: 16px; height: 16px; display: block; }
.ft-dp-wheel-item span {
  font-size: 10px; font-weight: 500; letter-spacing: 1px; line-height: 1;
}
.ft-dp-wheel[data-light="1"] .ft-dp-wheel-item {
  background: rgba(255, 255, 255, .42);
  border-color: rgba(255, 255, 255, .65);
  color: #17181d;
  box-shadow: 0 6px 20px rgba(40, 50, 80, .16),
              inset 0 1px 0 rgba(255, 255, 255, .9);
}

/* 水泡（旧鲸鱼的喷潮/睡觉冒泡）：半透明小圆上浮消散 —— 与「说话气泡」是两回事 */
.ft-dp-wbub { position: absolute; width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.72); background: rgba(255,255,255,.16);
  pointer-events: none; animation: ft-dp-wbub 1.15s ease-out forwards; }
@keyframes ft-dp-wbub {
  0%   { opacity: 0; transform: translate(0, 0) scale(.4); }
  18%  { opacity: .9; }
  100% { opacity: 0; transform: translate(var(--wx, 0px), -46px) scale(1); } }
.ft-dp-thumb { display: flex; align-items: center; gap: 9px; }
.ft-dp-icon {
  flex: none; width: 34px; height: 34px; border-radius: 9px;
  border: 1px solid var(--ft-accent-softer); background: var(--ft-accent-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 500; color: var(--ft-accent); letter-spacing: .3px;
}

/* ── 投喂：张嘴 + 食物颗粒 + 咀嚼 ─────────────────────────────────────── */
.ft-dp-food {
  position: absolute; width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #fff6dc 0%, var(--ft-accent) 62%, rgba(0,0,0,.22) 100%);
  box-shadow: 0 0 9px var(--ft-accent-soft); pointer-events: none;
  transition: transform .34s cubic-bezier(.4,.1,.3,1), opacity .34s;
}
.ft-dp-cage { position: absolute; pointer-events: none; }
/* 玻璃穹顶（2.17.3）：规整拱顶（固定像素半径）+ 安静玻璃 —— 顶部一条 rim light、
   底部一道细基座线，不再脉动/大高光；颜色仍吃 --ft-accent 系皮肤变量，换肤自动跟色 */
/* ★ 2.18.0：穹顶视觉搬进主窗口子视图（resources/cage.html）——桌面浮层 30Hz 推坐标
   会拖窗口不同步、浮层级太高会压到别的应用。这里 .shell 保留在 DOM 里只为
   data-open 状态机/探针兼容，display:none 不再画；围栏物理、边条命中、鱼本身不动。 */
.ft-dp-cage .shell {
  display: none;
  position: absolute; inset: 0;
  border-radius: 75px 75px 8px 8px / 62px 62px 8px 8px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.015) 48%, transparent 72%),
    var(--ft-accent-bg);
  border: 1px solid var(--ft-accent-softer);   /* 底沿只有这一条线 —— 不再叠 ::after 基座线 */
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 0 8px var(--ft-accent-softer);
  /* 速度：无过冲缓动；origin 压在底沿 —— 消散时玻璃向下收进基线，不往上飘 */
  transform-origin: 50% 100%;
  transition: opacity .42s ease-out, transform .42s cubic-bezier(.4, 0, .2, 1);
}
/* 开门 = 玻璃罩消散 */
.ft-dp-cage[data-open="1"] .shell { opacity: 0; transform: scaleY(.5); }
.ft-dp-cage .hit { position: absolute; background: transparent; pointer-events: auto; }
.ft-dp-cage .hit.t { left: 0; right: 0; top: 0; height: 14px; }
.ft-dp-cage .hit.b { left: 0; right: 0; bottom: 0; height: 14px; }
.ft-dp-cage .hit.l { top: 0; bottom: 0; left: 0; width: 14px; }
.ft-dp-cage .hit.r { top: 0; bottom: 0; right: 0; width: 14px; }
.ft-dp-cage.shake { animation: ft-cage-shake .42s ease; }
@keyframes ft-cage-shake {
  0%,100% { transform: translate(0,0); } 20% { transform: translate(-2.5px,0); }
  45% { transform: translate(2.5px,-1px); } 70% { transform: translate(-1.5px,1px); }
}
#ft-pet[data-mood="dead"] { opacity: .92; }
.ft-dp-carry {
  position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px;
  border-radius: 6px; pointer-events: none; opacity: 0;
  background: linear-gradient(160deg, rgba(255,255,255,.94), rgba(255,255,255,.55));
  border: 1px solid var(--ft-accent-soft);
  box-shadow: 0 1px 4px rgba(0,0,0,.18);
  font: 700 9px/18px -apple-system, "PingFang SC", sans-serif; text-align: center;
  color: #2b2b33; letter-spacing: .2px;
  transition: opacity .3s;
}
.ft-dp-carry .n {
  position: absolute; right: -7px; top: -7px; min-width: 14px; height: 14px;
  border-radius: 7px; background: var(--ft-accent); color: #fff;
  font: 700 9px/14px -apple-system, sans-serif; text-align: center; padding: 0 3px;
  box-shadow: 0 0 6px var(--ft-accent-soft);
}
.ft-dp-crumb {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  background: var(--ft-accent-soft); pointer-events: none; opacity: 0;
}
.ft-dp-heart { position: absolute; width: 11px; height: 10px; opacity: 0; animation: ft-dp-heart-up 1.3s ease-out forwards; pointer-events: none; }
.ft-dp-heart::before, .ft-dp-heart::after {
  content: ""; position: absolute; top: 0; width: 5.5px; height: 9px; border-radius: 5.5px 5.5px 0 0; background: var(--ft-accent-soft);
}
.ft-dp-heart::before { left: 5.5px; transform-origin: 0 100%; transform: rotate(-45deg); }
.ft-dp-heart::after  { left: 0;    transform-origin: 100% 100%; transform: rotate(45deg); }
@keyframes ft-dp-heart-up { 0% { opacity: 0; transform: translate(0,0) scale(.35); } 22% { opacity: .92; } 100% { opacity: 0; transform: translate(var(--hx,0),-32px) scale(1.05); } }
.ft-dp-ripple {
  position: absolute; width: 22px; height: 9px; margin: -4px 0 0 -11px; border-radius: 50%;
  border: 1px solid var(--ft-accent-soft); opacity: 0; animation: ft-dp-ripple-out 1.05s ease-out forwards; pointer-events: none;
}
@keyframes ft-dp-ripple-out { 0% { opacity: .5; transform: scale(.35); } 100% { opacity: 0; transform: translate(var(--rx,0),7px) scale(1.6); } }
.ft-dp-spark {
  position: absolute; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; opacity: 0;
  animation: ft-dp-spark-out 1s ease-out forwards; pointer-events: none;
}
.ft-dp-spark::before, .ft-dp-spark::after {
  content: ""; position: absolute; left: 50%; top: 50%; border-radius: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.96) 50%, rgba(255,255,255,0) 100%);
}
.ft-dp-spark::before { width: 15px; height: 1.5px; margin: -0.75px 0 0 -7.5px; }
.ft-dp-spark::after  { width: 1.5px; height: 15px; margin: -7.5px 0 0 -0.75px;
  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.96) 50%, rgba(255,255,255,0) 100%); }
@keyframes ft-dp-spark-out { 0% { opacity: 0; transform: scale(.25) rotate(0deg); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.35) rotate(120deg) translateY(-10px); } }

/* ── 拖放悬停：整屏一圈呼吸光，告诉你「现在扔它身上就行」 ─────────────── */
#ft-dp-dropzone {
  position: fixed; inset: 0; pointer-events: none; opacity: 0;
  transition: opacity .2s ease;
  box-shadow: inset 0 0 0 2px var(--ft-accent-soft), inset 0 0 90px var(--ft-accent-bg);
}
#ft-dp-dropzone[data-on="1"] { opacity: 1; animation: ft-dp-zone 1.5s ease-in-out infinite; }
@keyframes ft-dp-zone { 0%,100% { box-shadow: inset 0 0 0 2px var(--ft-accent-soft), inset 0 0 70px var(--ft-accent-bg); } 50% { box-shadow: inset 0 0 0 2px var(--ft-accent), inset 0 0 120px var(--ft-accent-bg); } }
</style>

</head>
<body>
<div id="ft-pet-layer">
  <div id="ft-pet" data-mood="roam" data-mouth="shut"></div>
</div>
<div id="ft-dp-dropzone" data-on="0"></div>

<script>
(function () {
  'use strict';

  var svgns = 'http://www.w3.org/2000/svg';
  var TAU = Math.PI * 2;

  /* ── PETRIG · 参数化造型框架 ──────────────────────────────────────────────
     造型 = **一组数字**（见下面的 BREED_PARAMS）。所有路径由 PETRIG 派生：

       解剖参数 ──┬─ 轮廓（Catmull-Rom 样条过背线/腹线控制点，闭合）
                  ├─ 三层着色（亮背 / 主色 / 白腹 / 暗缘）＝ 从背腹线向内的**色带**
                  │    → "白肚上边界与嘴线共线"这件事由构造保证，不用靠记性
                  ├─ 受光（背线月牙 + 头部高光）＝ 背线再向内一道
                  ├─ 背鳍 / 眼罩 ＝ 由基准点 + 高度 + 后掠角算
                  ├─ 胸鳍 ＝ 局部桨形 × (挂点, 角度, 比例)
                  ├─ 尾鳍 ＝ 一片共用桨（含浅缺口）
                  └─ 眼 ＋ 高光 ＝ 由"眼占体高的比例"推出来，不手填绝对值

     两件工具：
       PETRIG.audit()   逐条验**几何不变量**（体长比 / 眼占比 / 鳍根宽 / 尾柄台阶…）
       PETRIG.dErrors() **路径语法**校验（命令后参数个数、NaN）
     ⚠️ 为什么需要 dErrors：手写路径时"漏一个空格"会让浏览器**整条 d 丢弃**，
        部件凭空消失、页面不报错、只在 console 留一行 —— 这类错误必须挡在生成期。 */
  var PETRIG = (function () {

    /* 数值统一出口：非有限值降级成默认值，绝不把 NaN 写进路径 */
    function nf(v, d) { v = Number(v); return isFinite(v) ? v : d; }
    function q(v) { return String(Math.round(nf(v, 0) * 10) / 10); }
    function P(p) { return q(p[0]) + ',' + q(p[1]); }

    /* ── 路径语法校验：命令 + 参数个数 + 全部有限 ───────────────────────── */
    var ARGC = { M: 2, L: 2, H: 1, V: 1, C: 6, S: 4, Q: 4, T: 2, A: 7, Z: 0 };
    function dErrors(d) {
      var out = [];
      if (typeof d !== 'string' || !d) return ['路径为空'];
      var re = /([MmLlHhVvCcSsQqTtAaZz])([^MmLlHhVvCcSsQqTtAaZz]*)/g, m, any = false;
      while ((m = re.exec(d)) !== null) {
        any = true;
        var cmd = m[1], body = m[2].trim();
        var nums = body ? body.split(/[\s,]+/) : [];
        for (var i = 0; i < nums.length; i++) {
          if (!isFinite(Number(nums[i]))) out.push(cmd + ' 参数 "' + nums[i] + '" 不是有限数字');
        }
        var need = ARGC[cmd.toUpperCase()];
        if (need === 0) { if (nums.length) out.push(cmd + ' 不应带参数'); }
        else if (nums.length % need !== 0) out.push(cmd + ' 参数个数 ' + nums.length + ' 不是 ' + need + ' 的整数倍');
      }
      if (!any) out.push('没有命令字母');
      return out;
    }

    /* ── 样条：Catmull-Rom → 三次贝塞尔（closed=true 首尾相接） ───────────
       vfix：可选。vfix[i] 为真 → 第 i 个结点的切矢 **x 分量清零**（切线取竖直）。
       用途：尾柄两侧结点取竖直切线 → 身体轮廓**竖直**收进尾柄。不修正时均匀
       Catmull-Rom 会把这两处的切矢甩向右方、轮廓外鼓约 3 个单位戳进尾鳍。
       只清零 x、保留 y 与切矢长度，且相邻两段共用同一个修正后的切矢 → C1 不破。
       不传 vfix 时与旧实现**逐字节等价**（原式 (p2-p0)/6 就是这里 mi/3 的展开）。 */
    function cr(pts, closed, vfix) {
      var n = pts.length, i, d = 'M' + P(pts[0]);
      function at(k) { return closed ? pts[(k % n + n) % n] : pts[Math.max(0, Math.min(n - 1, k))]; }
      function kv(k) {
        var a = at(k - 1), b = at(k + 1), mx = (b[0] - a[0]) / 2;
        return [vfix && vfix[k] ? 0 : mx, (b[1] - a[1]) / 2];
      }
      var last = closed ? n : n - 1;
      for (i = 0; i < last; i++) {
        var p1 = at(i), p2 = at(i + 1), mi = kv(i), mj = kv(i + 1);
        d += ' C' + P([p1[0] + mi[0] / 3, p1[1] + mi[1] / 3]) +
             ' ' + P([p2[0] - mj[0] / 3, p2[1] - mj[1] / 3]) + ' ' + P(p2);
      }
      return d + (closed ? ' Z' : '');
    }

    /* ── 色带：一条边界曲线 + 往远处兜的三个角点（多余部分被身体裁掉） ────
       ⚠️ `edge` 必须**按 x 从左到右**排。反着传会让闭合墙落在右端，
          整条带子塌成一条细缝（实测：白肚成了底边上一根奶油色细线）。 */
    function band(edge, xFar, yFar) {
      var a = edge[0], b = edge[edge.length - 1];
      return cr(edge, false) + ' L' + q(xFar) + ',' + q(b[1]) +
             ' L' + q(xFar) + ',' + q(yFar) + ' L' + q(a[0]) + ',' + q(yFar) + ' Z';
    }
    /* ── 折线化：按 Catmull-Rom 把控制点采成**密集点列**。
       色带要沿**法线**等距偏移，而稀疏控制点算不出稳定法线（相邻点离得远，法线跳），
       密集点列上的中心差分法线才够平滑。per = 每段采样数。 */
    function poly(pts, closed, vfix, per) {
      per = per || 14;
      var n = pts.length, out = [], i, k, t, mt;
      function at(j) { return closed ? pts[(j % n + n) % n] : pts[Math.max(0, Math.min(n - 1, j))]; }
      function kv(j) {
        var a = at(j - 1), b = at(j + 1), mx = (b[0] - a[0]) / 2;
        return [vfix && vfix[j] ? 0 : mx, (b[1] - a[1]) / 2];
      }
      var last = closed ? n : n - 1;
      for (i = 0; i < last; i++) {
        var p1 = at(i), p2 = at(i + 1), mi = kv(i), mj = kv(i + 1);
        var c1 = [p1[0] + mi[0] / 3, p1[1] + mi[1] / 3], c2 = [p2[0] - mj[0] / 3, p2[1] - mj[1] / 3];
        for (k = 0; k < per; k++) {
          t = k / per; mt = 1 - t;
          out.push([mt * mt * mt * p1[0] + 3 * mt * mt * t * c1[0] + 3 * mt * t * t * c2[0] + t * t * t * p2[0],
                    mt * mt * mt * p1[1] + 3 * mt * mt * t * c1[1] + 3 * mt * t * t * c2[1] + t * t * t * p2[1]]);
        }
      }
      if (!closed) out.push(at(last));
      return out;
    }

    /* ── 沿**法线**等距偏移（正 = 向曲线内侧）。
       背线（吻→尾）内侧朝下、腹线（尾→吻）内侧朝上 —— 同一个 (-dy, dx)/|·| 同时成立，
       所以两条线都按**自然方向**偏移即可，腹线偏移完再 reverse 成 band 要的「吻→尾」。
       ⚠️ 旧版色带是「只改 y」的垂直偏移：轮廓陡的地方带子被压薄（厚度随坡度变），
       吻端那条竖直的边还会**绕到下巴下面**，在脸上切出一道 2.6 宽的竖条。
       等距偏移让色带与轮廓**处处平行**，宽度只由厚度曲线决定。
       ⚠️ 几何不变量：等距偏移要求**偏移量 < 该处曲率半径**（内偏 d 后半径 = R − d，
       d > R 时平行曲线就打尖/自交）。实测当前三款吻端 R≈7、最大偏移 ≈6.5，余量够用，
       所以**不做钳制**。曾按 0.72·R 钳制过一版：逐路径对比 47 条路径的每个坐标，
       差异 **0.0000**（纯空转 —— 说明偏移量确实处处小于 R），已删除，不留无实效的机器。
       若以后把 bellyDip / rimGap / depth 调到接近 R，须回来补钳制；判据：
       `offsetEdge` 输出在吻端相邻点**不得反向**（即 y 沿线不得出现多余的极值）。 */
    function offsetEdge(pts, off, closed, vfix, per) {
      var p = poly(pts, closed, vfix, per), m = p.length, out = [], i;
      for (i = 0; i < m; i++) {
        var ia = closed ? (i - 1 + m) % m : Math.max(0, i - 1);
        var ib = closed ? (i + 1) % m : Math.min(m - 1, i + 1);
        var dx = p[ib][0] - p[ia][0], dy = p[ib][1] - p[ia][1];
        var ln = Math.sqrt(dx * dx + dy * dy) || 1;
        var o = (typeof off === 'function') ? off(i / (m - 1), p[i]) : off;
        out.push([p[i][0] - dy / ln * o, p[i][1] + dx / ln * o]);
      }
      return out;
    }

    /* ── 单调三次插值（Fritsch–Carlson），用于色带**厚度曲线**。
       ⚠️ 旧版分段线性：斜率在关键帧处突变 → 色带边缘在 0.28L/0.5L/0.8L 留下折点。
       用普通 Catmull-Rom 会**过冲**（厚度可能变负 → 色带翻到轮廓外面），所以取单调版。 */
    function mono(xs, ys) {
      var n = xs.length, d = [], m = [], i;
      for (i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
      m[0] = d[0]; m[n - 1] = d[n - 2];
      for (i = 1; i < n - 1; i++) m[i] = (d[i - 1] * d[i] <= 0) ? 0 : (d[i - 1] + d[i]) / 2;
      for (i = 0; i < n - 1; i++) {
        if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
        var A = m[i] / d[i], Bq = m[i + 1] / d[i], tot = A * A + Bq * Bq;
        if (tot > 9) { var f = 3 / Math.sqrt(tot); m[i] = f * A * d[i]; m[i + 1] = f * Bq * d[i]; }
      }
      return function (x) {
        if (x <= xs[0]) return ys[0];
        if (x >= xs[n - 1]) return ys[n - 1];
        var k = 0; while (k < n - 2 && x > xs[k + 1]) k++;
        var h = xs[k + 1] - xs[k], t = (x - xs[k]) / h, t2 = t * t, t3 = t2 * t;
        return (2 * t3 - 3 * t2 + 1) * ys[k] + (t3 - 2 * t2 + t) * h * m[k] +
               (-2 * t3 + 3 * t2) * ys[k + 1] + (t3 - t2) * h * m[k + 1];
      };
    }

    /* ── 月牙带（沿法线）：外缘 / 内缘各一条等距线，厚度为参数曲线的函数 →
       两端自然收口（0 宽度），不会留"贴了一道胶带"的平头。 */
    function ribbonN(pts, oA, oB, per, vfix) {
      var a = offsetEdge(pts, oA, false, vfix, per);
      var b = offsetEdge(pts, oB, false, vfix, per).reverse();
      return cr(a, false) + ' ' + cr(b, false).replace(/^M/, 'L') + ' Z';
    }
    /* 圆润小块（头部高光） */
    function blob(cx, cy, rx, ry, k) {
      k = k || 8;
      var pts = [], i, t;
      for (i = 0; i < k; i++) { t = i / k * Math.PI * 2; pts.push([cx + Math.cos(t) * rx, cy + Math.sin(t) * ry]); }
      return cr(pts, true);
    }

    /* ── 胸鳍：局部桨形（**根端必须宽**，窄根埋进身体只露尖 → 读成爪尖/疣） ─
       2026-09-22（用户选项2「改细长叶形」）：宽高比 1.37 → **1.86**（长 39 / 最宽 21）。
       理由：桌面显示倍率 0.48 下旧那片"胖桨"只露 ~12 用户单位 ≈ 6px，读作「肚皮下的小突点」
       而不像鲸鳍；细长叶形在同一露出量下才读得出是胸鳍。
       ⚠️ 尖端 x 仍**钉在 37**：build() 里 finTip 用硬编码 37 推下边界，把它改长会让 viewBox
       裁掉鳍尖（且不报错，只是"那片鳍缺一角"）。
       ⚠️ 别靠 `rw` 调粗细：rw 只缩 x（g=rw/22），**rw 越小鳍越墩**（长度按 g 缩、厚度按 sc 缩），
       想细长只能改这张表或放大 rw（但放大 rw 会踩上面那个 37 的旧账）。 */
    var FIN_LOCAL = [[-2, -9], [11, -10.5], [25, -7], [33, -3], [37, 0], [37, 1.2],
                     [33, 4.5], [25, 7.5], [11, 9.5], [-2, 9]];
    function paddle(cx, cy, angDeg, sc, rw) {
      var k = nf(sc, 1), g = nf(rw, 22) / 22, a = nf(angDeg, 40) * Math.PI / 180;
      var ca = Math.cos(a), sa = Math.sin(a);
      var p = FIN_LOCAL.map(function (t) {
        var x = t[0] * k * g, y = t[1] * k;
        return [cx + x * ca - y * sa, cy + x * sa + y * ca];
      });
      return 'M' + P(p[0]) + ' C' + P(p[1]) + ' ' + P(p[2]) + ' ' + P(p[3]) +
             ' C' + P(p[4]) + ' ' + P(p[5]) + ' ' + P(p[6]) +
             ' C' + P(p[7]) + ' ' + P(p[8]) + ' ' + P(p[9]) + ' Z';
    }

    /* ── 尾鳍：一片宽扁桨 + 尾端浅缺口（缺口 ≤32% 才不会变成金鱼尾） ────── */
    var TAIL_PTS = [[0, -6], [12, -11], [26, -16.5], [38, -17], [45, -17.3], [48, -13.7], [44, -9.7],
                    [41, -6.6], [39, -3.4], [38, 0], [39, 3.4], [41, 6.6], [44, 9.7], [48, 13.7],
                    [45, 17.3], [38, 17], [26, 16.5], [12, 11], [0, 6]];
    function tailPath(sc, wide) {
      sc = nf(sc, 1); wide = nf(wide, 1);
      var p = TAIL_PTS.map(function (t) { return [t[0] * sc, t[1] * sc * wide]; });
      var d = 'M' + P(p[0]);
      for (var i = 1; i < p.length; i += 3) d += ' C' + P(p[i]) + ' ' + P(p[i + 1]) + ' ' + P(p[i + 2]);
      return d + ' Z';
    }

    /* ── 背鳍：镰刀。**尖端必须在底座靠后处、后缘短而内凹** ──────────────
         尖端放在底座前段 = 一根竖刺；后缘画成直线 = 鲨鱼鳍。 */
    function dorsalPath(bx, rootY, h, back, width) {
      var tip = [bx + width * back, rootY - h];
      return 'M' + P([bx, rootY + 4]) +
        ' C' + P([bx + width * 0.10, rootY - h * 0.58]) + ' ' + P([tip[0] - width * 0.26, tip[1] + h * 0.05]) + ' ' + P(tip) +
        ' C' + P([tip[0] + width * 0.14, tip[1] + h * 0.34]) +
        ' ' + P([bx + width * 1.04, rootY - h * 0.32]) + ' ' + P([bx + width, rootY + 4]) + ' Z';
    }

    /* ── 背鳍 (b)：圆钝小鳍 —— 参照**最初版品牌鲸**那枚 ────────────────────
       最初版头顶那枚是：低、靠前、尖端**圆的**、整体像一枚拇指往斜后方翘。
       镰刀（上面的 dorsalPath）画不出这个形：它靠两条贝塞尔在尖端硬拼，
       必然出**尖角**。圆尖只能靠一条闭合的圆滑曲线 —— 用 cr() 穿 6 个点，
       尖端自然收圆（点数少 → 曲率平滑，不会在尖端鼓成球）。
       back = 尖端在底座上的位置占比（>0.5 表示往斜后方翘）。 */
    function dorsalBlob(bx, rootY, h, back, width) {
      back = nf(back, 0.62);
      var pts = [
        [bx, rootY + 4],                                    // 前根（埋进身体）
        [bx + width * 0.09, rootY - h * 0.60],              // 前缘中段
        [bx + width * back - h * 0.30, rootY - h * 0.92],   // 尖前肩
        [bx + width * back, rootY - h],                     // 尖端
        [bx + width * back + h * 0.26, rootY - h * 0.84],   // 尖后肩
        [bx + width * 0.94, rootY - h * 0.30]               // 后缘中段
      ];
      return cr(pts, true);
    }

    /* ── 眼罩（虎鲸身份证）：梭形 —— 前尖、后圆。斜椭圆会读成"贴了颗白蛋" ── */
    function patchPath(cx, cy, len, w, tiltDeg) {
      var a = nf(tiltDeg, -8) * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
      var loc = [[-len / 2, 0], [-len * 0.06, -w / 2], [len * 0.30, -w * 0.34],
                 [len / 2, 0], [len * 0.30, w * 0.34], [-len * 0.06, w / 2]];
      var pts = loc.map(function (t) {
        return [cx + t[0] * ca - t[1] * sa, cy + t[0] * sa + t[1] * ca];
      });
      return cr(pts, true);
    }

    /* ── 由参数派生一个造型 ─────────────────────────────────────────────── */
    function build(p) {
      p = p || {};
      var L = nf(p.L, 150), hT = nf(p.hTop, 26), hB = nf(p.hBot, 36);
      var hf = nf(p.headFrac, 0.48), melon = nf(p.melon, 0.08);
      var chin = nf(p.chinLift, 15), stock = nf(p.stockHalf, 5);
      var snout = nf(p.snout, 0);
      var height = hT * (1 + melon) + hB;      // 体高 = 背峰到腹底

      /* ① 轮廓控制点。局部坐标：吻端 x=0、尾柄 x=L、基线 y=0 = 尾柄轴。
            背线（前→后）与腹线（后→前）拼成一个闭合环。
         ⚠️ **吻端必须是一段"圆弧"而不是一个尖点**：样条在端点的切线由前后邻点
            决定，若后邻点离得很远（早期版本把额隆放在 0.42L），前脸就成了一条
            45° 的斜楔 —— 渲染出来是"鸭嘴 / 尖鼻子"。做法：在吻端前后各放一个
            近邻点（面部前坡 + 下颌前沿），把切线掰成接近竖直，前脸才立得住。 */
      var noseY    = hB * (snout > 0 ? 0.16 : 0.22);   // 吻端落在嘴线高度（头下 1/3~1/5）
      var noseTip  = [0, noseY];
      var faceUp   = [L * 0.02, -hT * 0.46];           // ⚠️ 必须与吻端同 x（±3）→ 切线才竖直
      var shoulder = [L * 0.115, -hT * 0.84];          // 头前肩
      var melonPt  = [L * nf(p.melonX, 0.30), -hT * (1 + melon)];   // 额隆峰
      var headEnd  = [L * (hf * 1.04), -hT * 0.97];
      var backMid  = [L * 0.72, -hT * 0.89];
      var backLow  = [L * 0.89, -hT * 0.52];
      var stockTop = [L, -stock];
      var top = [];
      if (snout > 0) {
        top.push([-snout, noseY - hT * 0.06]);         // 吻突尖
        top.push([-snout * 0.34, noseY]);              // 吻突上缘
        top.push([L * 0.04, -hT * nf(p.snoutCrease, 0.34)]);  // 吻后的凹 —— 海豚的脸就在这道凹上（分数越小凹越深）
      } else {
        top.push(noseTip, faceUp);
      }
      top.push(shoulder, melonPt, headEnd, backMid, backLow, stockTop);
      /* 腹线：**一条光滑曲线**从尾柄直通吻端，不设"下巴"特征点 ——
         头 / 身的分界交给大圆顶 + 眼位 + 嘴线去表达；给肚子开豁口只会多出
         一片挂在嘴下面的白"胡子"（本版第一张渲染图的实测）。 */
      var bot = [
        [L, stock],
        [L * 0.80, hB * 0.94],
        [L * 0.50, hB],
        [L * 0.28, hB * 0.74],
        [L * 0.055, hB * 0.34]
      ];
      if (snout > 0) bot.push([-snout * 0.34, noseY + hT * 0.20]);   // 吻突下缘
      /* 尾柄两侧结点的切线取竖直（top 末点 = 索引 7、bot 首点 = 索引 8）：
         身体轮廓竖直收进尾柄。不修正时轮廓会外鼓 3.0 个单位、戳出尾柄线 3 单位
         （实测 max x = 158.06 > L = 155），在尾鳍根上留一个鼓包。 */
      var vfBody = []; vfBody[7] = 1; vfBody[8] = 1;
      var body = cr(top.concat(bot), true, vfBody);

      /* ② 嘴线：从吻端沿头前段斜下，末端上翘收一个嘴角（拉满全身 = 香蕉笑） */
      var mStart = snout > 0 ? -snout * nf(p.mouthAtTip, 0.96) : 0;
      /* mouthAtTip：嘴线起点离吻尖多近（1 = 顶到尖）。海豚的吻长，嘴顶到尖会
         把整条吻划开读成裂缝 —— 收进 0.70，只笑在吻部中段。 */
      var mY0 = noseY;
      var mEnd = L * nf(p.mouthFrac, 0.34);
      var drop = hB * nf(p.mouthDrop, 0.30);
      var hook = hB * nf(p.mouthHook, 0.12);
      var mouth = [
        [mStart, mY0],
        [mStart + (mEnd - mStart) * 0.40, mY0 + drop * 0.70],
        [mEnd * 0.82, mY0 + drop],
        [mEnd, mY0 + drop - hook]
      ];
      /* ②b 嘴 = **有体积的月牙笑口**（2026-09-22：用户嫌"一条黑线"太难看）。
         上缘 = 原微笑曲线；下缘 = 同曲线控制点再往下沉 mt（中间最厚、两端收尖）
         → 闭合成月牙填充。比描边线有厚度有嘴角，读得出"在笑"而不是"划了一道"。 */
      var mt = hB * nf(p.mouthThick, 0.17);
      var mouthFill = 'M' + mouth[0][0] + ',' + mouth[0][1] +
        ' C' + mouth[1][0] + ',' + mouth[1][1] + ' ' + mouth[2][0] + ',' + mouth[2][1] + ' ' + mouth[3][0] + ',' + mouth[3][1] +
        ' C' + mouth[2][0] + ',' + (mouth[2][1] + mt * 1.15) + ' ' + mouth[1][0] + ',' + (mouth[1][1] + mt) + ' ' + mouth[0][0] + ',' + mouth[0][1] + ' Z';

      /* ③ 三层着色。白腹 = 贴着腹线的一条**楔形带**：吻端厚度→0（带子自然收敛到轮廓上）、
            体中段最厚、尾柄收回 —— 这样"白肚上缘"天然随身体走，也天然与嘴线不打架。
         2026-09-28 重做：偏移改**沿法线**、厚度曲线改**单调三次**（详见 PETRIG 里的注释）。 */
      var dip = hB * nf(p.bellyDip, 0.42);
      var KX = [0.00, 0.28, 0.50, 0.80, 1.00];                 /* 白肚厚度沿体长的分布 */
      var KY = [0.00, 0.45, 1.00, 0.78, nf(p.bellyTail, 0.05) * 7];  /* 吻端 0 / 中前段最厚 / 尾柄收回 */
      var lift = mono(KX, KY);
      /* ⚠️ 色带的**首点必须落在吻尖、且偏移为 0**。理由：band() 拿「首点的 x」当闭合墙，
         首点若落在身体**内部**，墙上就露出一条硬直边，而且这条带子**从此不再覆盖吻部**
         （实测：下巴出现一块直边楔形，白腹/暗缘的左端缩到 x≈10 而不是 0）。
         旧版靠「只改 y」的垂直偏移碰巧把首点推到轮廓外，纯属巧合 —— 改成沿法线偏移后
         这个巧合消失，必须显式保证。做法：① 腹线补上吻尖这一点（几何上腹线与背线
         本来就在吻尖相接）；② 厚度曲线在前段淡入（吻尖处厚度为 0）。
         自然方向是「尾 → 吻」，而 (-dy,dx) 法线在此正好指向体内 →
         先偏移再 reverse，得到 band 要求的「吻 → 尾」顺序。 */
      var botLine = bot.concat([[0, noseY]]);
      function fadeIn(xf, w) { var u = Math.min(1, Math.max(0, xf / w)); return u * u * (3 - 2 * u); }
      var bellyEdge = offsetEdge(botLine, function (t, pt) {
        return dip * lift(pt[0] / L);
      }, false, null, 14).reverse();
      var litEdge = offsetEdge(top, function (t, pt) {
        return nf(p.litInset, 2.6) * fadeIn(pt[0] / L, 0.10);   /* 吻端收口，不长成针尖 */
      }, false, null, 14);
      var xFar = L + nf(p.tailLen, 48) + 40;
      var lit   = band(litEdge, xFar, -999);
      var belly = band(bellyEdge, xFar, 999);
      var rim   = band(offsetEdge(botLine, function (t, pt) {
        return (dip * lift(pt[0] / L) + nf(p.rimGap, 4)) * fadeIn(pt[0] / L, 0.05);
      }, false, null, 14).reverse(), xFar, 999);
      /* ⑤b 背影（twoTone）：海豚计数阴影 —— 分界线以上压暗。top 已按 x 左→右排
         （band 的硬规矩），分界深度走 KX/KY 关键帧：吻端浅 → 体中段最深 → 尾柄收浅。
         depth 是全局倍率（1 = 默认曲线），调阴影轻重只动它。 */
      var back = null, backCls = 'ft-pet-back';
      if (p.twoTone) {
        /* TX/TY 可被参数覆盖：TY = 分界线深度（占 hT 比例，随 x 左→右）。
           熊猫肩带曲线（calf 覆盖）：吻端留白 → 肩/体中段最深 → 尾柄收浅，
           读作「黑背甲披在白身上」，与黑鳍黑尾黑眼罩拼成完整熊猫装。 */
        var TX = p.twoTone.TX || [0.00, 0.30, 0.55, 0.85, 1.00];
        var TY = p.twoTone.TY || [0.10, 0.40, 0.52, 0.38, 0.20];
        if (p.twoTone.style === 'ink') backCls = 'ft-pet-back-ink';
        var backAt = mono(TX, TY);
        back = band(offsetEdge(top, function (t, pt) {
          var xf = pt[0] / L;
          return hT * nf(p.twoTone.depth, 1) * backAt(xf) * fadeIn(xf, 0.05);
        }, false, null, 14), xFar, -999);
      }

      /* ④ 受光：沿背线一道**法线等距**月牙。厚度曲线 = sin 两端收尖 × 头部一个高斯鼓包。
         ⚠️ 旧版是「细月牙 ∪ 头部椭圆」两个子路径并集：两形状相交处必然出现一个凹口，
         在桌面上读成「蹭了一块污渍」。合成**一条**厚度曲线后不再有相交接缝。 */
      var si = nf(p.sheenIn, 5.5), so = nf(p.sheenOut, 11);
      var sA = nf(p.sheenFrom, 0.055), sB = nf(p.sheenTo, 0.93);
      var gx = nf(p.glintX, 0.235), gw = nf(p.glintW, 0.085), ga = nf(p.glintAmp, 1.05);
      var sheenW = function (xf) {
