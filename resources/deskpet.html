    breatheG = mk('g', { id: 'ft-pet-breathe' }, bendG);
    /* 背鳍、胸鳍都挂在**身体组**里、画在身体底板**之前** → 根端被身体盖住，
       看着是从背上/肚子下长出来的。挂在尾巴组里会跟着尾鳍一起甩，一眼假。 */
    if (B.dorsal) mk('path', { d: B.dorsal, class: B.panda ? 'ft-pet-ink-fill' : 'ft-pet-fill' }, breatheG);
    /* 远侧胸鳍：画在身体底板**之前**（底层）→ 根端整段被身体盖住，只从腹线
       下面露出一个小暗尖 —— 侧视图里「另一侧那片鳍」的正确读法（真实侧视
       只看得到近观众那片，远侧若隐若现）。它摆动与近侧**反相**（见 render）。 */
    if (B.finFar) {
      finFarG = mk('g', { id: 'ft-pet-fin-far', class: 'ft-pet-fin-far' }, breatheG);
      mk('path', { d: B.finFar, class: B.panda ? 'ft-pet-ink-fill' : 'ft-pet-fill' }, finFarG);
    } else {
      finFarG = null;
    }
    /* 近侧胸鳍 = **挪到身体着色层之后（体侧上层）**，见下面 faceG 前 ——
       2026-09-22 结构修正：贴在体侧的鳍不能压在身体底下。 */
    mk('path', { class: 'ft-pet-body', d: B.body }, breatheG);
    /* 三层着色：用「区域」而不是「椭圆渐变」出体积，全部裁在身体轮廓内。
         亮背（上）→ 主色（中，就是底板本身）→ 白腹（下）→ 暗缘（最下缘）
       白腹的上边界与嘴线是同一条 curve —— 一条线同时当「长嘴」和「肚皮分界」，
       这是鲸类最好认的身份特征，也让三层的过渡天然贴合身体形状。
       嘴线放在裁剪组里 → 超出轮廓的部分（海豚吻突那截）会被自动修掉，
       不用为每款造型手调端点。 */
    var clipped = mk('g', { 'clip-path': 'url(#ft-pet-clip)' }, breatheG);
    mk('path', { class: 'ft-pet-lit',   d: B.lit },   clipped);
    /* 背影（海豚计数阴影）：压在受光层上、白肚下 —— 背深腹浅的身份层 */
    if (B.back) mk('path', { class: B.backCls || 'ft-pet-back', d: B.back }, clipped);
    mk('path', { class: 'ft-pet-belly', d: B.belly }, clipped);
    mk('path', { class: 'ft-pet-dark',  d: B.rim },   clipped);
    /* 嘴 = 月牙笑口填充（旧版是 stroke 细线，桌面尺寸下就一条硬黑线，2026-09-22 弃用）*/
    mk('path', { class: 'ft-pet-mouth-fill', d: B.mouthFill }, clipped);
    /* 受光（specular）：卡通造型"是玩具不是贴纸"的关键一层 —— 沿背线一道月牙
       + 头上一块椭圆高光。画在裁剪组里（跟着身体轮廓走），不裁剪会糊到轮廓外。 */
    if (B.sheen) mk('path', { class: 'ft-pet-sheen', d: B.sheen }, clipped);
    if (B.adds) for (var a = 0; a < B.adds.length; a++) {
      mk(B.adds[a].el, Object.assign({ class: B.adds[a].cls }, B.adds[a].attrs), breatheG);
    }

    /* ── 涂装（look）：'classic' 卡通分层 · 'mech' 机械装甲 ──────────────────
       契约与造型/皮肤一致：**页面不自己存状态**，原生 ftSetLook(look) 推下来。
       全局量必须挂 window（`var` 是本次 build 的局部量，活不过一次 rebuild）；
       ftSetLook 就地定义在这里 —— 每次重建都重挂一遍，天然幂等。 */
    var LOOK = (window.FT_LOOK === 'mech') ? 'mech' : 'classic';
    petEl.setAttribute('data-look', LOOK);
    petEl.setAttribute('data-breed', BREED);   /* 造型名暴露给 CSS：发条鲸档要藏骨架件 */
    window.FT_BREED = BREED;                   /* render 里要按档位调姿态幅度（读属性太慢）*/
    window.ftSetLook = function (l) {
      l = (l === 'mech') ? 'mech' : 'classic';
      if (l === (window.FT_LOOK || 'classic')) return l;
      window.FT_LOOK = l;
      build();                       /* 几何与着色一起重建，避免半新半旧 */
      return l;
    };
    if (BREED === 'clockwork') {
      /* 发条鲸：整条鱼换成 AI 生图（app 图标同族）。**不装机械件** —— 位图自带齿轮，
         再叠一层程序化装甲只会打架。 */
      spiritSkin(breatheG);
    } else if (LOOK === 'mech') {
      /* 金属渐变：挂在 svg 上即可（渐变按 id 引用、永不渲染，不必塞进 defs）。
         停点由亮到暗 → 装甲「上受光下背光」，比纯色像金属。 */
      var mg = mk('linearGradient', { id: 'ft-pet-metal', x1: '0', y1: '0', x2: '0', y2: '1' }, svg);
      mk('stop', { offset: '0',    'stop-color': '#f2f7fc' }, mg);
      mk('stop', { offset: '0.30', 'stop-color': '#a8b4c2' }, mg);
      mk('stop', { offset: '0.68', 'stop-color': '#5f6a78' }, mg);
      mk('stop', { offset: '1',    'stop-color': '#2a3038' }, mg);
      mechParts(clipped, tailG, B, vb);
    }

    /* ── 发条鲸 v3（AI 生图 → 六层分离件）────────────────────────────────
       ② 上一版（v2）把主体整张图当唯一视觉，代价是尾鳍、胸鳍都只能"贴"在图上，
          动作僵硬。v3 把一张干净的「无齿轮鲸」切成六层：

            尾片(绕腰枢轴单向摆) → 主体 → 尾关节盖 → 胸鳍片(绕鳍根扇) → 鳍根盖 → 齿轮×3(整圈转)

          · 切尾缝 = **以枢轴为圆心的圆弧**。圆弧绕圆心旋转映射到自己 → 接缝在任何摆角下
            都精确闭合（v1 在轮廓上直切，旋转必然张开楔形缺口 → 用户报的"尾巴离开了"）。
          · 尾关节盖 / 鳍根盖是**静态**件：盖住旋转时不可避免的细缝。它们也是"绕枢轴画出来的"，
            所以盖上去不留边。
          · 齿轮是**单独生图**的三颗独立齿轮（第一版素材三颗互相咬合，亮掩码是单一连通域，
            切不开）→ 完整旋转对称 → 可以**整圈转**，不再是 ±16° 的小幅摆动。
          · 每层都是帧坐标下的独立 <image>，全部塞进 breatheG → 呼吸缩放统一生效；
            viewBox 换成位图坐标系（0 0 vw vh）→ 零形变、比例真实。
          · ⚠️ 不用 getBBox()：桌宠浮层未 true 布局时返回 0（实测图直接不可见）。 */
        /* ── 河道之灵（clockwork 档）：灵体涂装 ─────────────────────────────────
       王者「河道之灵」的读法：半透明灵体 + 亮边 + 莲冠 + 光点 + 水波。
       **全矢量 + CSS 动效**。原先的 AI 位图分层方案（v1~v3）已整体删除：
       它的尾片/鳍片切弧与旋转枢轴不同心，摆动时必然撕开金刺与缺口。
       颜色走 currentColor —— CSS 变量写进 SVG presentation attribute 不生效，
       但 currentColor 能在属性里解析，皮肤换色时灵体跟着变。 */
    function spiritSkin(breath) {
      var svg = breath.ownerSVGElement;
      if (!svg) return;
      var defs = svg.querySelector('defs');
      if (!defs) return;
      var stale = defs.querySelector('#ft-spirit-grads');
      if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
      var G = mk('g', { id: 'ft-spirit-grads' }, defs);

      var bodyGrad = mk('linearGradient', { id: 'ft-spirit-body', x1: '0.5', y1: '0', x2: '0.5', y2: '1' }, G);
      mk('stop', { offset: '0',   'stop-color': '#ffffff', 'stop-opacity': '.92' }, bodyGrad);
      mk('stop', { offset: '.22', 'stop-color': 'currentColor', 'stop-opacity': '.78' }, bodyGrad);
      mk('stop', { offset: '.62', 'stop-color': 'currentColor', 'stop-opacity': '.62' }, bodyGrad);
      mk('stop', { offset: '1',   'stop-color': 'currentColor', 'stop-opacity': '.38' }, bodyGrad);

      var rimGrad = mk('linearGradient', { id: 'ft-spirit-rim', x1: '0', y1: '0', x2: '1', y2: '1' }, G);
      mk('stop', { offset: '0',   'stop-color': '#ffffff', 'stop-opacity': '.98' }, rimGrad);
      mk('stop', { offset: '.45', 'stop-color': 'currentColor', 'stop-opacity': '.9' }, rimGrad);
      mk('stop', { offset: '1',   'stop-color': '#ffffff', 'stop-opacity': '.9' }, rimGrad);

      var auraGrad = mk('radialGradient', { id: 'ft-spirit-aura-g', cx: '.5', cy: '.5', r: '.5' }, G);
      mk('stop', { offset: '0',  'stop-color': 'currentColor', 'stop-opacity': '.5' }, auraGrad);
      mk('stop', { offset: '.5', 'stop-color': 'currentColor', 'stop-opacity': '.16' }, auraGrad);
      mk('stop', { offset: '1',  'stop-color': 'currentColor', 'stop-opacity': '0' }, auraGrad);

      var petalGrad = mk('linearGradient', { id: 'ft-spirit-petal', x1: '0.5', y1: '1', x2: '0.5', y2: '0' }, G);
      mk('stop', { offset: '0',   'stop-color': 'currentColor', 'stop-opacity': '.72' }, petalGrad);
      mk('stop', { offset: '.55', 'stop-color': 'currentColor', 'stop-opacity': '.38' }, petalGrad);
      mk('stop', { offset: '1',   'stop-color': '#ffffff', 'stop-opacity': '.95' }, petalGrad);

      /* ① 灵光 + ② 水波：都在鱼身后 → 插到 bendG 之前 */
      var back = mk('g', { id: 'ft-spirit-back' }, svg);
      mk('ellipse', { id: 'ft-spirit-aura', cx: 82, cy: -4, rx: 108, ry: 56,
                      fill: 'url(#ft-spirit-aura-g)' }, back);
      mk('ellipse', { id: 'ft-spirit-ripple1', cx: 80, cy: 36, rx: 58, ry: 5.4, fill: 'none',
                      stroke: 'currentColor', 'stroke-width': 1.3, opacity: '.42' }, back);
      mk('ellipse', { id: 'ft-spirit-ripple2', cx: 80, cy: 36, rx: 43, ry: 3.8, fill: 'none',
                      stroke: 'currentColor', 'stroke-width': 1, opacity: '.3' }, back);
      if (svg.firstChild && svg.firstChild.nextSibling) {
        svg.insertBefore(back, svg.firstChild.nextSibling);
      }

      /* ③ 莲冠（腹部）⑤ 光点：挂身体组，跟呼吸一起动 */
      var front = mk('g', { id: 'ft-spirit-front' }, breath);

      var lotus = mk('g', { id: 'ft-spirit-lotus' }, front);
      var CX = 112, CY = 24;   /* 腹部（2026-09-28 从头顶 46,-26 移来，避开胸鳍） */
      var petals = [[-68, 22], [-34, 30], [0, 36], [34, 30], [68, 22]];
      for (var i = 0; i < petals.length; i++) {
        var ang = petals[i][0], len = petals[i][1], w = len * 0.34;
        var d = 'M0,0 C' + (-w) + ',' + (-len * 0.36) + ' ' + (-w * 0.62) + ',' + (-len * 0.86) + ' 0,' + (-len) +
                ' C' + (w * 0.62) + ',' + (-len * 0.86) + ' ' + (w) + ',' + (-len * 0.36) + ' 0,0 Z';
        mk('path', { d: d, fill: 'url(#ft-spirit-petal)', stroke: 'currentColor',
                     'stroke-width': 0.7, 'stroke-opacity': '.5',
                     transform: 'translate(' + CX + ',' + CY + ') rotate(' + ang + ')' }, lotus);
      }
      mk('circle', { cx: CX, cy: CY - 6, r: 9.5, fill: 'currentColor', opacity: '.26' }, lotus);
      mk('circle', { cx: CX, cy: CY - 6, r: 5, fill: '#ffffff', opacity: '.95' }, lotus);

      /* 灵须(ribbon)：2026-09-28 用户「去掉杂乱的线条」→ 已删除 */

      var motes = [[-6, 6, 2.0, 0], [16, -44, 1.7, .9], [64, -50, 1.9, 1.7], [104, -22, 1.5, 2.5],
                   [150, -44, 2.0, .5], [190, 2, 1.6, 1.3], [176, 44, 2.0, 2.1], [96, 46, 1.7, 3.0],
                   [40, 40, 1.4, 3.6], [-4, -28, 1.5, 2.2]];
      for (var m = 0; m < motes.length; m++) {
        var mo = motes[m];
        mk('circle', { class: 'ft-spirit-mote', cx: mo[0], cy: mo[1], r: mo[2], fill: '#ffffff',
                       'fill-opacity': '.9', style: 'animation-delay:' + mo[3] + 's' }, front);
      }
    }


    /* 机械装甲零件（程序化，仅 look=mech 时使用）。全部按 **viewBox 归一化**定位，
       并裁在身体轮廓里 → 换造型自动适配，不必每款手调坐标。
       只做「读起来像机械」的四件事：分段板缝、铆钉、散热格栅、环形镜头。 */
    function mechParts(clip, tail, BR, box) {
      var bx = box[0], by = box[1], bw = box[2];
      var fx = function (k) { return bx + bw * k; };
      var fy = function (k) { return by + box[3] * k; };
      /* ① 三道板缝：略弯的竖线，裁到身体后只剩弧面那一段 —— 装甲分段感 */
      var sx = [0.34, 0.52, 0.70];
      for (var i = 0; i < sx.length; i++) {
        mk('path', { class: 'ft-pet-seam',
          d: 'M' + q2(fx(sx[i]) - bw * 0.02) + ',' + q2(fy(0.20)) +
             ' Q' + q2(fx(sx[i]) + bw * 0.02) + ',' + q2(fy(0.52)) +
             ' ' + q2(fx(sx[i]) - bw * 0.015) + ',' + q2(fy(0.82)) }, clip);
      }
      /* ② 铆钉：沿板缝各点三颗（板缝渗出离子光，铆钉压住缝） */
      for (var j = 0; j < sx.length; j++) {
        for (var k = 0; k < 3; k++) {
          mk('circle', { class: 'ft-pet-rivet',
            cx: q2(fx(sx[j]) + (k - 1) * bw * 0.011), cy: q2(fy(0.26 + k * 0.21)), r: 1.7 }, clip);
        }
      }
      /* ③ 散热格栅：背侧四道平行短线 */
      for (var g = 0; g < 4; g++) {
        mk('path', { class: 'ft-pet-grille',
          d: 'M' + q2(fx(0.15) + g * bw * 0.026) + ',' + q2(fy(0.28)) +
             ' L' + q2(fx(0.14) + g * bw * 0.026) + ',' + q2(fy(0.43)) }, clip);
      }
      /* ④ 环形镜头：套住原本的卡通眼 → 读作「传感器」 */
      mk('circle', { class: 'ft-pet-lens', cx: BR.eye.x, cy: BR.eye.y, r: BR.eye.r * 1.8 }, clip);
      /* ⑤ 尾部涡轮：三片叶轮 + 轮毂，挂在尾鳍组里 → 跟着摆尾一起动 */
      var tg = mk('g', { class: 'ft-pet-turbine',
        transform: 'translate(' + BR.tp.x + ',' + BR.tp.y + ')' }, tail);
      for (var b2 = 0; b2 < 3; b2++) {
        var ang = (b2 * 120 + 30) * Math.PI / 180;
        mk('path', { class: 'ft-pet-seam',
          d: 'M0,0 L' + q2(Math.cos(ang) * bw * 0.052) + ',' + q2(Math.sin(ang) * bw * 0.052) }, tg);
      }
      mk('circle', { class: 'ft-pet-rivet', cx: 0, cy: 0, r: 2.4 }, tg);
    }

    function q2(v) { return Math.round(v * 10) / 10; }

    /* 近侧胸鳍 = **画在身体着色层之后（体侧上层）**：真实鱼画法里近侧胸鳍贴在
       身体侧面上（尼莫/一切鱼插画都这么画），鳍身大部分盖在体侧、只鳍尖略过腹线。
       旧版画在身体底下 → 鳍身全被盖住、只能整片垂到肚子外面 =「残疾鱼」的根源。
       根端圆弧露在体侧上（卡通鳍本来就带可见的根部）；挥动由 render 独立驱动。 */
    finG = mk('g', { id: 'ft-pet-fin', class: 'ft-pet-fin' }, breatheG);
    mk('path', { d: B.fin, class: B.panda ? 'ft-pet-ink-fill' : 'ft-pet-fill' }, finG);

    faceG = mk('g', { id: 'ft-pet-face' }, breatheG);
    eyeG  = mk('g', { id: 'ft-pet-eye' }, faceG);
    if (B.panda) mk('circle', { class: 'ft-pet-sclera', cx: B.eye.x, cy: B.eye.y, r: B.eye.r * 1.3 }, eyeG);
    mk('circle', { class: 'ft-pet-pupil', cx: B.eye.x, cy: B.eye.y, r: B.eye.r }, eyeG);
    mk('circle', { class: 'ft-pet-glint',  cx: B.eye.x + B.eye.g1.dx, cy: B.eye.y + B.eye.g1.dy, r: B.eye.g1.r }, eyeG);
    mk('circle', { class: 'ft-pet-glint2', cx: B.eye.x + B.eye.g2.dx, cy: B.eye.y + B.eye.g2.dy, r: B.eye.g2.r }, eyeG);
    mk('ellipse', { class: 'ft-pet-mouth-open',
                    cx: B.mouthO.x, cy: B.mouthO.y, rx: B.mouthO.rx, ry: B.mouthO.ry }, faceG);

    rollEl.appendChild(svg);
    squashEl.appendChild(rollEl);
    liftEl.appendChild(squashEl);
    petEl.appendChild(shadowEl);
    petEl.appendChild(haloEl);        /* 呼吸辉光：压在鱼身之下、地面影之上 */
    petEl.appendChild(liftEl);

    // 地面阴影宽度跟着体型走
    var sw = Math.round(PET_W * 0.61), sh = Math.round(sw * 0.178);
    shadowEl.style.width = sw + 'px'; shadowEl.style.height = sh + 'px';
    shadowEl.style.margin = (-sh / 2) + 'px 0 0 ' + (-sw / 2) + 'px';

    P.x = clamp(P.x || Math.round(W * 0.66), 0, Math.max(0, W - PET_W));
    P.y = clamp(P.y || Math.round(H * 0.72), 0, Math.max(0, H - PET_H));
    P.flip = 1; P.face = 1;
    pickTarget();
    P.nextPlay = now() + 5200;                // 别一上来就表演，先游一会儿（旧鲸鱼同款）
  }

  /* ── 局部坐标 → 世界坐标（考虑朝向），用于把泡泡/食物挂到嘴边 ────────── */
  function toWorld(lx, ly) {
    var facing = P.face;                      // 与 render 同一个朝向来源，别各算一份
    var k = PET_W / VBN[2];
    var px = (lx - VBN[0]) * k;
    var py = (ly - VBN[1]) * k;
    return { x: P.x + PET_W / 2 + facing * (px - PET_W / 2),
             y: P.y + PET_H / 2 + (py - PET_H / 2) };
  }

  /* ── 每帧 ─────────────────────────────────────────────────────────────
     ★ 先把下一帧排上，再干活。写成本函数最后一行的话，中途任何一步抛异常
       都会让循环整体死掉 —— 表现是「鲸鱼突然冻住」，而 pageerror 只在控制台
       一闪。本文件第一版就是栽在这上面（render 里引了 frame 的局部变量）。 */
  function frame(ts) {
    frameArmed = false;                       // 本帧在执行 → 队列空
    if (POWER.level === 'rest') return;       // 停止档：不再排下一帧（下一次点火由 powerSet('full') 负责）
    armFrame();
    /* 省电档：整帧跳过（连物理都不算），rAF 回调只剩一次比较。
       跳过的 ~45ms 由 ts-lastT 在下一帧如实补回 —— 本文件所有衰减都写成 pow(底, dt)、
       与帧率无关，所以行为不变，只有观感降到 ~22fps（睡着时 12fps，动作本来就慢）。
       2.23.7：本档不再自动进入（只有别处 ftPower('eco') 手动点火才会走到这里）。 */
    if (POWER.level === 'eco' && ts - POWER.lastRun < (P.asleep ? DOZE_MS : ECO_MS)) return;
    POWER.lastRun = ts;

    var dt = lastT ? Math.min(0.05, (ts - lastT) / 1000) : 0.016;
    lastT = ts;
    P.t = now();
    P.dt = dt;
    if (dt > 0) { fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; } }

    var t = P.t;
    var fst = clamp(P.speed / 130, 0, 1);          // 归一速度：0 怠速 → 1 全速

    idleTick(t);                                   // 功率自治（2.23.0）：降档 / 打盹 / 回岛

    /* ── 相位：各自独立频率（非整数比）→ 不会锁相成「整块橡皮」──────────
       摆尾/拍鳍的频率**随速度上升**，这是「它在用力游」与「它在飘」的分界。 */
    /* ⚠️ 怠速频率别调高：旧版怠速 1.55Hz（0.65 秒一摆），停着也像在抽搐。
       活物静止时几乎不动 —— 怠速 0.55Hz，跑到全速才升到 2.55Hz。 */
    var tailF = 0.55 + fst * 2.00;
    if (P.bellyN > 0) tailF = Math.max(tailF, 0.95);   // 负重：低速也在用力打水
    /* 工作哨兵（2.24.0）：dsh 在跑 → 摆尾带上「在干活」的节奏。
       只改这一个数 —— 不加元素、不位移、不出字，这是「不抢戏」的底线。
       睡着时不加（它自己选的睡，别把人吵醒）。 */
    if (P.work === 'busy' && !P.asleep) tailF = Math.max(tailF, 1.25);
    P.tailF = tailF;                                   // 上报真实值（ftState 别再反推）
    P.phTail  += dt * tailF * TAU;
    P.phFin   += dt * (0.50 + fst * 1.20) * TAU;
    P.phBreath += dt * (0.24 + fst * 0.46) * TAU;
    P.phDrift += dt * HZ_DRIFT * TAU;

    /* ── 漂移（内部噪声，制造「它自己也拿不定主意」的微动）── */
    P.driftTx += dt * 0.35;
    if (P.driftTx > P.driftTy) {
      P.driftTy = P.driftTx + rnd(1.4, 3.6);
      P.driftX = rnd(-7, 7);
      P.driftY = rnd(-4, 4);
    }

    if (!P.drag) {
      var dx = P.tx - P.x, dy = P.ty - P.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      /* 冻结门（2.20.0）：鼠标靠近 / 气泡可见 / 轮盘开着 → 不派新漫游目标。
         鱼此刻多半已减速停在原地（进入冻结时 tx 已设为自身），停住等人来。 */
      var holdStill = P.near || P.menuOpen || (env.bubble && t < env.bubbleUntil);
      var slow = (P.chewing || P.asleep) ? 0.28 : 1;
      /* 负重（2.16.3）：嘴里含着鲸腹存货 → 上限压低、加速变钝（货越多越沉）。
         叼着东西还全速窜 = 没有重量感；上限 124×load，9 个时约 52px/s。 */
      var load = P.bellyN > 0 ? clamp(0.72 - 0.034 * P.bellyN, 0.42, 0.72) : 1;
      /* 到点前线性收速（dist×0.62）+ 上限 118 = 「减速靠站」，不是撞上去再急刹。
         旧版 dist<6 时 speed*=0.86（**每帧**）：0.17 秒速度掉到 0.2 倍 —— 肉眼就是一顿。
         衰减一律写成 pow(底, dt)，与帧率无关（120Hz 屏上旧写法会快一倍）。 */
      var want = clamp(dist * 0.72, 0, 124) * slow * load;
      if (dist < 8) {
        P.speed *= Math.pow(0.25, dt);
        /* ★ 节目进行中不许 pickTarget 抢目标：startAct 靠 tx=x 停住 + restUntil=0，
           不加 actUntil 守卫的话下一帧就被漫游目标覆盖 —— 表演全变成「游来游去」
           （2.15.1 实测病症的根因：节目根本没机会演完）。 */
        if (t > P.actUntil && t > P.restUntil && !holdStill) { P.restUntil = t + rnd(1500, 5200); pickTarget(); }
      } else {
        P.speed += (want - P.speed) * Math.min(1, dt * 1.7 * load);
      }
      if (dist > 0.001) {
        P.vx += (dx / dist * P.speed - P.vx) * Math.min(1, dt * 3.2);
        P.vy += (dy / dist * P.speed - P.vy) * Math.min(1, dt * 3.2);
      }
      P.x += P.vx * dt;
      P.y += P.vy * dt;
      clampInside();
      if (Math.abs(P.vx) > 2) {
        var want2 = Math.atan2(P.vy, P.vx);
        var diff = ((want2 - P.heading + Math.PI * 3) % TAU) - Math.PI;
        P.heading += diff * Math.min(1, dt * 1.6);
      }
    } else {
      P.speed *= 0.9;
      /* 撸：按住不动 620ms 才成立（用位移区分「抚摸」与「搬运」）—— 沿用旧鲸鱼 v4。
         会腻/会累 → 挣脱几秒不再接受抚摸（这就是「有个性」），不是有求必应的按钮。 */
      if (!P.petting && P.moved < 6 && t - P.downAt > 620 && t > P.petRefuseUntil) {
        if (P.bored > 0.62 || P.stamina < 0.2) {
          P.petRefuseUntil = t + 4200;
          P.bored = 0.18;
          P.petting = false; P.drag = false;
          petEl.style.cursor = 'grab';
          jolt(4.4);
          pickTarget();
        } else {
          P.petting = true; P.heartAt = 0;
        }
      }
      if (P.petting) {
        var kk = Math.min(1, (t - P.downAt - 620) / 1100);
        P.jellyV += 8.0 * kk * dt;                     // 手底下轻轻下沉
        if (t - P.heartAt > 440) { P.heartAt = t; blowHearts(1); }
        P.tame = Math.min(1, P.tame + dt * 0.014);
        P.stamina = Math.max(0, P.stamina - dt * 0.022);
        P.lastInteract = t;
      }
    }

    /* ── 内部状态推进（沿用旧鲸鱼 v4）：体力/兴奋/腻/心情 ──
       运动与互动消耗体力；没人理就慢慢变腻；心情决定节目池 → 行为有理由 */
    P.stamina = clamp(P.stamina + (P.asleep ? 0.020 : (fst > 0.25 ? -0.014 : -0.004)) * dt, 0, 1);
    P.arousal = clamp(P.arousal - (P.asleep ? 0.020 : 0.012) * dt, 0.15, 1);
    if (t - P.lastInteract > 8000 && !P.drag) P.bored = clamp(P.bored + dt * 0.006, 0, 1);
    P.mood = moodNow();
    /* 节目到期 → 回 roam */
    if (P.actUntil && t > P.actUntil && P.mode !== 'roam') {
      P.mode = 'roam'; P.actUntil = 0;
    }
    /* 自主挑节目：只在 roam、没被拖、没睡着、没在注意你、没在陪光标的时候
       （⚠️ 陪光标时插播节目 = 目标点来回跳 → 光标前 4.3px 假抽动，门禁实测）*/
    if (!P._calm && !P.drag && !P.asleep && !P.attn && !P.cageIn && P.actUntil <= t &&
        t > P.nextPlay && t >= P.chaseUntil) pickPlay(t);
    /* 睡觉：周期性冒一个小泡（旧鲸鱼同款「z 泡」的水下版）*/
    if (P.asleep && t - P.zAt > 2400) { P.zAt = t; spray(1, true); }
    /* 桌面上的鱼得会自己醒（2.23.0）：笼内那套苏醒分支管不到它 —— 否则「打盹」会变成睡死。 */
    if (P.asleep && P.sleepUntil && !P.cageIn && !P.hidden && t > P.sleepUntil) {
      P.asleep = false; P.blink = 1; P.sleepUntil = 0;
      P.nextPlay = t + rnd(3500, 9000);
    }

    /* ── 凑过来看你 ──
       ⚠️ 三条规矩，缺一条它就"抽风"（旧版三条全缺）：
       ① 只在鼠标**刚动过**时才接管目标。旧版 mouse.active 一旦置真永不回退，
          鼠标停了十分钟它还在追那个陈年坐标。
       ② 侧向让位量必须**平滑**：旧版写 `mouse.x > cxx ? -30 : 30`，鼠标横向扫过鲸鱼
          中线时符号瞬翻 → 目标点跳 60px → 它跟着来回弹（高频抖动的主因）。
          改成对让位方向做低通，符号变了也要花半秒挪过去。
       ③ 看了 2.6 秒还没人理它就放掉（chaseUntil），回去自己游 —— 不是黏住。 */
    if (mouse.active && !P.drag) {
      var cxx = P.x + PET_W / 2, cyy = P.y + PET_H / 2;
      var mdx = mouse.x - cxx, mdy = mouse.y - cyy;
      var md = Math.sqrt(mdx * mdx + mdy * mdy);
      var fresh = (t - mouse.at) < 1400;
      /* 注意力三段式（沿用旧鲸鱼 v4）：① 先注意到（停住愣 0.23~0.4s，这个停顿
         正是「活的」证据）→ ② 再判断（熟人度/心情决定凑近还是躲开 —— 会拒绝你）
         → ③ 才行动。零延迟的应答等于按钮，不是生物。 */
      var busyAct = P.actUntil > t;
      if (P.attn && (P.asleep || P.drag || busyAct || md > 190)) P.attn = 0;
      if (!P.attn && !P.asleep && !busyAct && !P.petting && !P.islandGo &&
          fresh && md < 118 && t - P.lastInteract > 1600 && P.fleeUntil < t) {
        P.attn = 1; P.attnAt = t;
        P.attnHold = 230 + Math.random() * 170;
        P.tx = P.x; P.ty = P.y;                        // 先停住
      } else if (P.attn === 1 && t - P.attnAt > P.attnHold) {
        var pr = 0.26 + P.tame * 0.52 - (P.mood === 'annoyed' ? 0.5 : 0) - (P.mood === 'tired' ? 0.2 : 0);
        P.attn = 2; P.attnAt = t;
        P.attnPlan = Math.random() < pr ? 'approach' : 'away';
      } else if (P.attn === 2 && t - P.attnAt > 140) {
        P.attn = 0;
        if (P.attnPlan === 'away') {
          fleeFrom(mouse.x, mouse.y, t);
        } else {
          P.chaseUntil = t + 2600;                     // 凑到旁边看你
          P.arousal = Math.min(1, P.arousal + 0.16);
        }
      }
      if (!P.attn && !P.asleep && !P.islandGo && md < 120 && t < P.chaseUntil) {
        P.chaseUntil = t + 2600;
        /* ★★ 让位方向**必须锁存 + 带回差**。
           把 sideWant 直接挂在 (mouse.x − 鲸鱼中心) 的符号上是一个**自激振荡**：
           鲸鱼的中心一旦停在光标正下方，mdx 的符号逐帧翻转 → sideWant 在 ±1 之间跳
           → 目标点跟着 ±34px 抖 → 它就在光标前面原地微抽。
           实测（这一版变小之后）5 秒内折返 6 次、摆幅 1px —— 幅度小但频率高，
           正是用户说的"抽风"里最烦人的那一种（看着像卡帧）。
           两条规矩：① 一次「凑过来」只判**一次**方向（sideOn 锁存）；
                    ② 之后再改判，必须先跑偏超过 2 倍让位量（68px 回差带）。 */
        if (!P.sideOn) {
          P.sideWant = (mdx >= 0) ? -1 : 1;             // 让到鼠标没压住的那一侧
          P.sideOn = true;
        } else if (Math.abs(mdx) > 68) {
          P.sideWant = (mdx >= 0) ? -1 : 1;
        }
        P.side += (P.sideWant - P.side) * Math.min(1, dt * 2.2);
        P.tx = clamp(mouse.x - PET_W * 0.5 + P.side * 34, bounds().l, bounds().r);
        P.ty = clamp(mouse.y - PET_H * 0.5 - 14, bounds().t, bounds().b);
      } else {
        P.sideOn = false;                              // 放掉之后，下次「凑过来」重新判一次
        P.side += (0 - P.side) * Math.min(1, dt * 1.4);
      }
    }

    /* ── 眼皮 ── */
    if (t > P.nextBlink) {
      P.nextBlink = t + (P.asleep ? 900 : rnd(2600, 6800));
      P.blink = 0.08;
    }
    P.blink += (1 - P.blink) * Math.min(1, dt * 7);

    /* ── 跳跃：hopY 是**离地高度、向上为正** ──
       hopV 初值正（向上），重力把它减到负 → hopY 先升后落，回到 0 落地。
       ⚠️ 两个坑都踩过：① 把重力写成 `hopV += HOP_G*dt`（符号反了）→ hopV 单调增、
          hopY 单调降，永远回不到 0，每跳一次鲸鱼往上飘一段，最后飘出视口。
          症状极具欺骗性：不抛异常、上报里 P.y 依然正常、桌面穿透判定也「正确」，
          只是它已经不在那个坐标了（用 getBoundingClientRect 抓到 y=-4755 才暴露）。
       ② 把 hopY 当成「向上为负」→ hopY 一出手就 ≥0，落地判定立刻命中，鲸鱼
          再也跳不起来（不报错，只是没反应）。改这里前先确认坐标系。 */
    if (P.hopV !== 0 || P.hopY > 0) {
      P.hopY += P.hopV * dt;
      if (P.cageIn && P.hopY > 10) { P.hopY = 10; if (P.hopV > 0) { P.hopV = 0; jolt(3); } }   /* 穹顶封顶：撞玻璃就摁回 */
      P.hopV -= 1250 * dt;
      if (P.hopY <= 0) { P.hopY = 0; P.hopV = 0; jolt(7.5); }
    }
    P.jellyV += (-P.jelly * 92 - P.jellyV * 8.5) * dt;
    P.jelly += P.jellyV * dt;

    /* ── 姿态：俯仰 ──
       旧版身体**永远水平**地平移（heading 只喂了 flip，没有任何旋转）—— 这是"僵硬"
       最大的一处：上浮/下潜时身体该是斜的。用 vy 求角，分母加 46 抑制"原地微动也甩头"。
       跳起来时把 hopV 也算进去：起跳抬头、落地低头（预备/跟随动作）。 */
    var wantPitch = clamp(Math.atan2(P.vy + P.hopV * 0.30, Math.abs(P.vx) + 46) * 57.3, -26, 26);
    if (P.asleep) wantPitch *= 0.35;
    if (P.bellyN > 0 && !P.asleep) wantPitch += 4 + fst * 6;   // 负重：头微微下沉
    wantPitch = clamp(wantPitch, -26, 30);
    P.pitch += (wantPitch - P.pitch) * Math.min(1, dt * 3.0);

    /* ── 咀嚼 ── */
    if (P.chewing && t > P.chewUntil) { P.chewing = false; P.mouthOpen = 0; }
    if (P.chewing && Math.random() < dt * 9) jolt(rnd(2.4, 5));

    /* ── 回笼 / 灵动岛调度 ──────────────────────────────────────────────── */
    if (P.hidden) {
      /* 藏在岛里：什么都不做（位置上报已切成 -9999，穿透照常） */
    } else if (cage.want) {
      if (Math.sqrt(Math.pow(P.tx - P.x, 2) + Math.pow(P.ty - P.y, 2)) < 14) cageShut();
    } else if (P.islandGo) {
      if (P.y < 26 && Math.abs((P.x + PET_W / 2) - W / 2) < 90) {
        P.islandGo = false; P.hidden = true;
        P.islandCd = now() + 45000;
        report('islandArrive', {});
        /* 到家就睡（2.23.0）：桌面页从这一刻起没有任何东西要看 → 停帧（rest 档）。
           出岛（ftIslandOut，鼠标碰到岛）会唤醒。于是「它回家了」同时是体验与能耗的最优解。 */
        P.asleep = true; P.sleepUntil = 0;
        P.tx = P.x; P.ty = P.y; P.speed = 0;
        powerSet('rest');
      }
    } else if (P.cageIn && cage.on && !P.drag) {
      if (P.playdead) {
        if (t > P.playdeadUntil) { P.playdead = false; jolt(4.5); P.cageNext = t + rnd(3500, 7000); }
      } else if (P.asleep && P.sleepUntil) {
        if (t > P.sleepUntil) { P.asleep = false; P.blink = 1; P.cageNext = t + rnd(3000, 6000); }
      } else if (P.ramPending) {
        if (Math.abs(P.tx - P.x) < 12) {
          P.ramPending = false;
          jolt(8.5); P.hopV = 70;
          if (cageEl) { cageEl.classList.add('shake'); setTimeout(function () { if (cageEl) cageEl.classList.remove('shake'); }, 460); }
          report('cage', { shake: 1 });   /* 穹顶（主窗口里）跟着晃 */
          spray(4);
          P.restUntil = t + 700;
          P.cageNext = t + rnd(4000, 9000);
        }
      } else if (t > (P.cageNext || 0)) {
        var roll = Math.random();
        if (roll < 0.26) {                    /* 踱步 */
          pickTarget();
          P.cageNext = t + rnd(2800, 5200);
        } else if (roll < 0.48) {             /* 撞笼子：冲向一侧笼壁，撞得笼子晃 */
          var b2 = bounds();
          P.ramPending = true;
          P.tx = Math.random() < 0.5 ? b2.l + 3 : b2.r - 3;   /* 撞到玻璃边但不越界 */
          P.ty = clamp(P.y + rnd(-14, 14), b2.t, b2.b);
          P.restUntil = 0;
          P.cageNext = t + 5000;              /* 兜底（正常由命中分支续期）*/
        } else if (roll < 0.66) {             /* 装死：白肚朝天 + 眼闭紧，飘一会儿 */
          P.playdead = true; P.playdeadUntil = t + rnd(3200, 5800);
          P.tx = P.x; P.ty = P.y; P.speed = 0;
        } else if (roll < 0.82) {             /* 吐泡 */
          spray(Math.round(rnd(4, 7)));
          P.cageNext = t + rnd(2500, 5000);
        } else {                              /* 趴底睡一觉 */
          P.asleep = true; P.sleepUntil = t + rnd(3800, 7500);
          P.tx = P.x; P.ty = P.y;
          P.cageNext = t + 20000;             /* 醒来分支接管 */
        }
      }
    }

    render();
    placeMic(t);

    /* ── 位置上报（原生侧穿透判定的唯一依据）────────────────────────────────
       原生以 30Hz 轮询鼠标、拿这个矩形做命中测试：命中才把鼠标事件让给鲸鱼，
       否则整块浮层穿透。所以上报**必须持续**（鲸鱼一直在游，位置一直在变），
       50ms 一次 ≈ 20Hz，最快游速下两次之间只挪约 6px，原生侧 16px 缓冲够吃。
       ⚠️ 必须写在这里而不是 render() 里 —— t 是 frame 的局部量，render 里没有它。 */
    if (t - lastReportAt > 50) {
      lastReportAt = t;
      /* 藏进灵动岛时上报 -9999：原生命中区落空 → 整层照常穿透，不会挡住菜单栏 */
      if (P.hidden) {
        report('rect', { x: -9999, y: -9999, w: 1, h: 1, drag: false });
      } else {
        var rx = Math.round(P.x), ry = Math.round(P.y);
        var rw = Math.round(PET_W * (P.scale || 1)), rh = Math.round(PET_H * (P.scale || 1));
        /* 麦克风 chip 并进命中矩形：它跟着鱼但不属于鱼身，漏了就是「看得见点不着」 */
        if (micEl && micEl.getAttribute('data-on')) {
          var mw = micEl.offsetWidth || 58, mh = micEl.offsetHeight || 24;
          var mlx = parseFloat(micEl.style.left) || 0, mly = parseFloat(micEl.style.top) || 0;
          var ux = Math.min(rx, mlx), uy = Math.min(ry, mly);
          rw = Math.round(Math.max(rx + rw, mlx + mw) - ux);
          rh = Math.round(Math.max(ry + rh, mly + mh) - uy);
          rx = Math.round(ux); ry = Math.round(uy);
        }
        /* 长按轮盘并进命中矩形：圈比鱼身大得多，漏了就是「轮盘看得见点不着」 */
        if (P.menuOpen && wheelEl && wheelEl.getAttribute('data-on')) {
          var wx = parseFloat(wheelEl.style.left) || 0, wy = parseFloat(wheelEl.style.top) || 0;
          var wr = 62 + 24 + 4;    /* 布局半径 62 + 按钮半径 23 + 余量 */
          var ux2 = Math.min(rx, wx - wr), uy2 = Math.min(ry, wy - wr);
          rw = Math.round(Math.max(rx + rw, wx + wr) - ux2);
          rh = Math.round(Math.max(ry + rh, wy + wr) - uy2);
          rx = Math.round(ux2); ry = Math.round(uy2);
        }
        report('rect', { x: rx, y: ry, w: rw, h: rh, drag: !!P.drag });
      }
    }
  }

  function jolt(v) { P.jellyV += (v === undefined ? 4 : v) * 0.9; }

  /* ── 渲染：把状态翻译成各骨骼的 transform ─────────────────────────────
     动画片宠物的四条基本功，全在这里：
       ① 挤压拉伸（squash & stretch）—— 速度驱动 + 跳跃 + 咀嚼共用 jelly
       ② 跟随与延迟（overlapping）—— 尾巴/胸鳍各有自己的相位，且相位错开
       ③ 预备与跟随（anticipation/follow-through）—— 起跳前先压扁
       ④ 弧线与非对称 —— 转向时侧倾（banking），转身经过压扁而不是瞬间翻面 */
  function render() {
    var B = BREEDS[BREED];
    var dt = P.dt;
    /* 朝向：**带滞回的显式状态**，不再每帧从 heading 现算。
       垂直上浮/下潜时 heading→±90°、cos≈0，符号逐帧翻 —— 身体在 ±1 之间抽搐（抽风）。
       规矩：只有横向速度够大（|vx|>26）时才允许改朝向。

       ★★ 镜像判据：画面里**吻端在局部 x=0（左侧）**、尾鳍在 x=L+（右侧）。
          所以「向右游」要 scaleX(-1) 把鼻子翻到右边 —— 写成 `vx<0 ? -1 : 1`
          就是**倒着游**（2026-09-22 实测：向右游时眼睛落在身体盒的 19%，
          即头在左、尾在右，而它正往右走）。这一条错了不会报错、也不会崩，
          只会让它在半个方向上拖着尾巴走 —— 「不像活鱼」的一半在这里。 */
    if (Math.abs(P.vx) > 26) {
      var vf = P.vx > 0 ? -1 : 1;
      if (vf !== P.face) P.face = vf;
    }
    var facing = P.face;
    var fst = clamp(P.speed / 130, 0, 1);

    /* 转身：不瞬间镜像。flip 连续地穿过 0，那一瞬身体宽度趋近 0，
       天然形成「翻页」的压扁 —— 有体积感的转身。 */
    P.flip += (facing - P.flip) * Math.min(1, dt * 8);
    var flip = P.flip;

    /* 尾巴：主摆 + 二次谐波（去掉机械的正弦感）*/
    var tailAng = Math.sin(P.phTail) * (8 + fst * 15)
                + Math.sin(P.phTail * 2 + 1.1) * (1.8 + fst * 4.0);
    /* 摆浪：整条生物绕**体心**转一点，头与尾自然反向摆。相位比尾巴落后 0.5rad
       —— 这是"跟随动作"：尾先动、身随后，而不是整块橡皮一起晃。
       怠速 ±1.4°（几乎看不出），全速 ±4.0°（游起来才明显）。 */
    P.sway = -Math.sin(P.phTail - 0.5) * (1.4 + fst * 2.6) * (P.bellyN > 0 ? 1.35 : 1);
    /* 胸鳍：相位天然落后于尾巴（频率不同），摆动方向偏「向下压水」*/
    var finAng = Math.sin(P.phFin + 0.9) * (4.5 + fst * 5)
               + Math.sin(P.phFin * 2 + 2.4) * 1.2 + 3;

    var breathe = Math.sin(P.phBreath) * 0.022;
    var j = P.jelly;
    var turn = 1 - Math.abs(flip);                  // 翻面中点的压扁量
    var sx = 1 + breathe + fst * 0.05 + j * 0.05 + turn * 0.07;
    var sy = 1 - breathe * 0.75 - fst * 0.035 - j * 0.07;

    /* 位置：hopY 向上为正 → 世界坐标要**减**（屏幕 y 轴朝下）*/
    /* 竖直起伏：慢漂移 + 与摆尾同频的小上下 —— 鲸靠尾叶上下打水前进，身体必然
       跟着一起一伏。这是"活鱼"最省的一笔（0 成本，纯相位耦合）。 */
    var lift = Math.sin(P.phDrift) * 2.6 + Math.sin(P.phTail + 1.0) * (0.7 + fst * 2.2);
    if (P.bellyN > 0) lift += 3.2 + Math.sin(P.phTail * 0.5) * 1.1;   // 负重：吃水更深（屏幕 y 向下为正 → 加正数才是下沉）
    var sc = P.scale || 1;
    petEl.style.transform = 'translate3d(' + num(P.x, 0) + 'px,'
      + num(P.y - P.hopY + lift + P.driftY, 0) + 'px,0)' + (sc !== 1 ? ' scale(' + sc + ')' : '');
    var wantOp = (P.hidden || (!cage.on && P.cageIn)) ? '0' : '';
    if (petEl.style.opacity !== wantOp) petEl.style.opacity = wantOp;

    /* 姿态（屏幕空间）：俯仰 + 侧倾，**必须乘 flip**。
       rollEl 的变换是 `rotate(A) scaleX(±1)`：先镜像、后旋转。所以朝左时角度要取反，
       否则"下潜"会画成"抬头"（旧版 bank 就有这个反向 bug，只是 ±9° 看不出来）。
       俯仰是本轮新增：之前身体永远水平地平移，这是僵硬感最大的一处。 */
    var bank = num(clamp(P.vy * 0.045, -7, 7) + Math.sin(P.phDrift * 0.7) * 1.8, 0);
    /* 乘 **−flip**（不是 flip）：鼻子在右边时（flip=−1）下潜要正角，在左边时要负角。
       换个说法：att 与 flip 的符号**永远相反** —— 门禁就是这么验的。
       写错方向的后果是"下潜画成抬头"，±9° 时代看不出来，现在 ±26° 一眼就能看出。 */
    /* 发条鲸档把俯仰/侧倾压到 0.55 —— 位图鱼体态是"画好的水平鲸"，
       骨架那套为程序化鱼调的 ±26° 幅度套上去会显得东倒西歪。 */
    var att = num((P.pitch + bank) * (0 - flip) * (window.FT_BREED === 'clockwork' ? 0.55 : 1), 0);
    rollEl.style.transform = 'rotate(' + att + 'deg) scaleX(' + num(flip, 1) + ')'
      + (P.playdead ? ' scale(1,-1)' : '');

    /* 挤压：体积守恒（横向胀 = 纵向缩）*/
    squashEl.style.transform = 'scale(' + num(sx, 1) + ',' + num(sy, 1) + ')';
    liftEl.style.transform = 'translateY(' + num(-Math.abs(P.hopY) * 0.04, 0) + 'px)';

    var air = clamp(Math.abs(P.hopY) / 60, 0, 1);
    shadowEl.style.transform = 'scale(' + num(1 - air * 0.45, 1) + ',' + num(1 - air * 0.32, 1) + ')';
    shadowEl.style.opacity = String(num(0.9 - air * 0.55, 0.9));

    /* 呼吸辉光：把呼吸相位映射到 0..1（breathe = sin × 0.022，故 ±0.022 满量程），
       再乘心情系数。写的是 opacity —— 纯合成属性，不在主线程重绘。
       睡着时压到 0.34：一只睡着的鱼不该像发光体。 */
    if (haloEl) {
      var bph = 0.5 + breathe / 0.044;               /* 0 = 最憋，1 = 最鼓 */
      bph = bph < 0 ? 0 : (bph > 1 ? 1 : bph);
      var hmood = P.asleep ? 0.34 : (P.mood === 'tired' ? 0.7 : 1);
      var hopS = String(num((0.10 + 0.26 * bph) * hmood, 0.1));
      if (haloEl.style.opacity !== hopS) haloEl.style.opacity = hopS;
    }

    /* 骨骼驱动 —— 全部走 SVG transform 属性，轴点显式给出，不给 CSS
       transform-origin 留任何解释空间（不同浏览器对 SVG transform-box 的
       默认值不一致，踩过）。 */
    if (tailG) tailG.setAttribute('transform',
      'rotate(' + num(tailAng, 0) + ' ' + B.tp.x + ' ' + B.tp.y + ')');
    if (finG) finG.setAttribute('transform',
      'rotate(' + num(finAng, 0) + ' ' + B.fp.x + ' ' + B.fp.y + ')');
    /* 远侧鳍：**反相**（乘 −0.8）。真鱼两片胸鳍是对角摆的 —— 同相会让它们
       像被一根轴串起来一起扇，比只画一片还假。 */
    if (finFarG && B.ffp) finFarG.setAttribute('transform',
      'rotate(' + num(0 - finAng * 0.62, 0) + ' ' + B.ffp.x + ' ' + B.ffp.y + ')');
    /* 摆浪（局部空间）：挂在 bendG 上，**同一个变换层级**里让尾鳍+身体一起转，
       尾根不可能脱节；尾鳍离转心更远 → 天然摆得更大。
       （分开转会在尾根留下 3~4px 的错位台阶，试过。） */
    if (bendG) bendG.setAttribute('transform',
      'rotate(' + num(P.sway, 0) + ' ' + B.bc.x + ' ' + B.bc.y + ')');
    if (breatheG) breatheG.setAttribute('transform',
      'translate(' + B.bc.x + ',' + B.bc.y + ') scale(' + num(sx, 1) + ',' + num(sy, 1)
      + ') translate(' + (-B.bc.x) + ',' + (-B.bc.y) + ')');

    /* 发条鲸位图层：尾/鳍改由骨架相位驱动（与 calf/orca 同源），不再是独立 CSS 摆。
       尾切缝双向 ±12 已验证 0 缝，双谐波摆角夹到 ±12.5 内；鳍 ±14。 */
    

    /* 视线：跟随鼠标（注意 facing 镜像补偿 —— 局部坐标已被镜像过）*/
    /* 参考点取**头那一侧**的边：flip=+1 时鼻子在左 → 用左边界；flip=−1 → 右边界。
       （原式写成 0.5+flip*0.5 正好取反，视线死区偏在尾侧，头一动就贴满偏移量。） */
    var gx = clamp((mouse.x - (P.x + PET_W * (0.5 - flip * 0.5))) * 0.012, -2.6, 2.6) * flip;
    var gy = clamp((mouse.y - (P.y + PET_H * 0.42)) * 0.010, -2.2, 2.2);
    if (!mouse.active) { gx = 0; gy = 0; }
    if (faceG) faceG.setAttribute('transform',
      'translate(' + num(gx, 0) + ',' + num(gy, 0) + ')');

    /* 眨眼：绕眼心纵向压扁（就是「闭眼盘成一条」）*/
    var blinkY = P.asleep ? 0.06 : Math.max(0.06, num(P.blink, 1));
    if (P.playdead) blinkY = 0.05;    /* 装死：眼闭紧（白肚朝天靠 scale(1,-1)）*/
    if (P.chewing) blinkY *= 0.7;                   // 嚼东西时眯眼
    if (eyeG) eyeG.setAttribute('transform',
      'translate(' + B.eye.x + ',' + B.eye.y + ') scale(1,' + num(blinkY, 1)
      + ') translate(' + (-B.eye.x) + ',' + (-B.eye.y) + ')');

    var mood = P.playdead ? 'dead' : (j > 0.5 ? 'eat' : (P.asleep ? 'asleep' : (P.drag ? 'drag' : 'roam')));
    if (petEl.getAttribute('data-mood') !== mood) petEl.setAttribute('data-mood', mood);
    var mo = P.mouthOpen ? 'open' : 'shut';
    if (petEl.getAttribute('data-mouth') !== mo) petEl.setAttribute('data-mouth', mo);

    /* 气泡到期自清：以前只靠 mousemove 顺路检查——光标不来鲸鱼身上，
       气泡就赖着不走（2.16.1 修：鲸腹的气泡全是「交互完人已离开」的场景，必踩）。 */
    if (env.bubble && now() > env.bubbleUntil) hideBubble();

    /* 叫人动线：气泡跟着鱼一起走。尺寸已缓存 → 不读布局；位移不过 1px 不写样式，
       所以只在「鱼真的在游」的那几帧有开销。会话气泡被 pin 住（鱼不动）时不跟。 */
    if (env.bubble && env.bubbleFollow) {
      var bsz = env.bubbleSize || { w: 240, h: 60 };
      var fbx = clamp(P.x + PET_W * 0.2, 12, Math.max(12, W - bsz.w - 12));
      var fby = clamp(P.y - bsz.h - 14, 12, Math.max(12, H - bsz.h - 12));
      if (Math.abs(fbx - env.bubbleX) > 1 || Math.abs(fby - env.bubbleY) > 1) {
        env.bubbleX = fbx; env.bubbleY = fby;
        env.bubble.style.left = num(fbx, 12) + 'px';
        env.bubble.style.top = num(fby, 12) + 'px';
      }
    }

    /* 鲸腹存货：嘴里叼着的「含着的东西」——看得见的口袋，位置每帧跟嘴 */
    if (carryEl) {
      var bn = P.bellyN | 0;
      if (bn > 0) {
        var mc = toWorld(BREEDS[BREED].mouthO.x, BREEDS[BREED].mouthO.y);
        carryEl.style.left = num(mc.x, 0) + 'px';
        carryEl.style.top = num(mc.y, 0) + 'px';
        carryEl.style.opacity = '1';
      } else {
        carryEl.style.opacity = '0';
      }
    }
  }

  /* ── 交互：拖拽 / 点击 / 双击 ─────────────────────────────────────────── */
  function petDown(e) {
    if (e.button !== 0) return;
    if (P.menuOpen) { wheelClose(); }            /* 轮盘开着再按鱼身：收盘直接摸鱼 */
    P.drag = true; P.moved = 0; P.downAt = now(); P.lastInteract = now();
    P.grabX = e.clientX - P.x; P.grabY = e.clientY - P.y;
    petEl.style.cursor = 'grabbing';
    try { petEl.setPointerCapture(e.pointerId); } catch (err) {}
    P.asleep = false;
    P.menuShown = false;
    jolt(3.4);
    /* 长按 850ms → 轮盘（挪动即取消：拖拽优先）。850 > 撸的 620ms：
       短长按是摸（爱心），按住不放才出轮盘 —— 同一个「按住」手势两级语义。 */
    if (P.lpTimer) { clearTimeout(P.lpTimer); }
    P.lpTimer = setTimeout(function () {
      P.lpTimer = 0;
      if (P.drag && P.moved < 10 && !P.hidden) { P.menuShown = true; wheelOpen(); }
    }, 850);
  }
  function petMove(e) {
    if (!P.drag) return;
    if (P.petting) return;                      // 撸着呢：手怎么动都不搬运它
    var nx = e.clientX - P.grabX, ny = e.clientY - P.grabY;
    P.moved += Math.abs(nx - P.x) + Math.abs(ny - P.y);
    if (P.lpTimer && P.moved > 10) { clearTimeout(P.lpTimer); P.lpTimer = 0; }
    P.vx = (nx - P.x) * 6; P.vy = (ny - P.y) * 6;
    P.x = nx; P.y = ny;
    /* 叼着关笼的鱼往外拖：拖出笼口就开门 —— 判定必须用**未夹取**的指针坐标
       （先 clampInside 的话坐标永远出不了笼界，判定永远不触发，2.17.0 实测）*/
    if (P.cageIn && cage.on) {
      var ccx = nx + PET_W * (P.scale || 1) / 2, ccy = ny + PET_H * (P.scale || 1) / 2;
      if (ccx < cage.x - 18 || ccx > cage.x + cage.w + 18 || ccy < cage.y - 18 || ccy > cage.y + cage.h + 18) {
        P.cageIn = false; cageDoor(true); P.scale = 1;
        P.playdead = false; P.ramPending = false;
        setTimeout(function () { cageDoor(false); }, 650);
        report('cage', { in: 0 });
      }
    }
    clampInside();
  }
  function petUp(e) {
    if (!P.drag) return;
    if (P.lpTimer) { clearTimeout(P.lpTimer); P.lpTimer = 0; }
    var wasPetting = P.petting;
    P.petting = false;
    P.drag = false;
    petEl.style.cursor = 'grab';
    try { petEl.releasePointerCapture(e.pointerId); } catch (err) {}
    if (P.menuShown) { P.menuShown = false; return; }   /* 轮盘已被长按呼出：别再当点击 */
    if (wasPetting) { P.lastInteract = now(); return; }   // 撸完不误触发点击
    if (P.moved < 7) { onTap(); }
    else {
      // 甩出去的惯性：松手速度接着飞一小段，然后自己游回去
      P.vx = clamp(P.vx, -900, 900); P.vy = clamp(P.vy, -900, 900);
      P.freeUntil = now() + 1100;     /* 惯性飞行期不受漫游界约束 */
      P.restUntil = now() + 520;
      /* 拖到灵动岛口松手 → 投递：设岛口目标 + 清干扰状态（只点火不指路它就游去旧目标了）*/
      if (!P.islandGo && !P.hidden) {
        var icx = P.x + PET_W / 2;
        if (P.y < 130 && Math.abs(icx - W / 2) < 120) {
          P.islandGo = true;
          P.tx = clamp(W / 2 - PET_W / 2, 2, Math.max(3, W - PET_W - 2));
          P.ty = 4;
          P.asleep = false; P.restUntil = 0; P.chaseUntil = 0; P.fleeUntil = 0;
        }
      }
      /* 拖进笼子松手 → 收监（先变大变小都交给 cageShut）*/
      if (cage.on && !P.cageIn) {
        var dcx = P.x + PET_W / 2, dcy = P.y + PET_H / 2;
        if (dcx > cage.x + 10 && dcx < cage.x + cage.w - 10 && dcy > cage.y + 8 && dcy < cage.y + cage.h - 8) {
          cageShut();
        }
      }
      P.lastInteract = now();
      report('moved', { x: Math.round(P.x), y: Math.round(P.y) });
    }
  }
  function onTap() {
    var t = now();
    if (t - P.lastClickAt < 320) { P.lastClickAt = t; return; }   // 双击的第一下留给 dblclick
    P.lastClickAt = t;
    P.lastInteract = t;
    P.hopV = 270;                                   // 起跳（重力在 frame 里减它）
    jolt(-3.2);                                     // 起跳前先**横向胀、纵向缩**蓄力
    P.tame = Math.min(1, P.tame + 0.01);
    P.arousal = Math.min(1, P.arousal + 0.12);
    P.bored = Math.max(0, P.bored - 0.15);
    blowHearts(5);
    report('tap', {});
  }
  function petDbl(e) {
    e.preventDefault();
    P.lastInteract = now();
    /* 嘴里有存货 → 双击 = 吐回剪贴板（原生写 NSPasteboard 后回调 ftSpit）*/
    if ((P.bellyN | 0) > 0) {
      try { window.webkit.messageHandlers.fatiaowuPet.postMessage({ kind: 'spit', data: {} }); } catch (err) {}
      return;
    }
    P.hopV = 330;
    jolt(11);
    blowHearts(9);
    var c = toWorld(BREEDS[BREED].mouthO.x, BREEDS[BREED].mouthO.y);
    ripple(c.x, c.y);
    say('嗝', '双击我不会变出东西哦', '拖个文件给我含着，双击再取走', 2200);
    report('dbltap', {});
  }

  /* ── 特效 ─────────────────────────────────────────────────────────────── */
  function ripple(x, y) {
    var el = document.createElement('div');
    el.className = 'ft-dp-ripple';
    el.style.left = num(x, 0) + 'px';
    el.style.top = num(y, 0) + 'px';
    el.style.setProperty('--rx', num(rnd(-14, 14), 0) + 'px');
    stage.appendChild(el);
    setTimeout(function () { el.remove(); }, 1150);
  }
  function blowHearts(n) {
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          var el = document.createElement('div');
          el.className = 'ft-dp-heart';
          el.style.left = num(P.x + PET_W * 0.32 + rnd(-14, 14), 0) + 'px';
          el.style.top = num(P.y + 14, 0) + 'px';
          el.style.setProperty('--hx', num(rnd(-22, 22), 0) + 'px');
          stage.appendChild(el);
          setTimeout(function () { el.remove(); }, 1400);
        }, i * 95);
      })(i);
    }
  }
  function blowSparks(n) {
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          var el = document.createElement('div');
          el.className = 'ft-dp-spark';
          el.style.left = num(P.x + PET_W / 2 + rnd(-40, 40), 0) + 'px';
          el.style.top = num(P.y + PET_H / 2 + rnd(-26, 26), 0) + 'px';
          stage.appendChild(el);
          setTimeout(function () { el.remove(); }, 1100);
        }, i * 60);
      })(i);
    }
  }

  /* ── 行为系统：沿用旧鲸鱼（alive.js v4 活体层）──────────────────────────
     节目 startAct / 按心情过滤的节目池 pickPlay / 心情 moodNow / 逃离 fleeFrom。
     「有个性」的落点：会累、会腻，所以不是有求必应的按钮；
     心情决定节目池 —— 每个行为都有「它这会儿为什么这样做」的理由。 */
  function wBub(x, y, n, spread) {
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          var el = document.createElement('div');
          el.className = 'ft-dp-wbub';
          var s = 4 + Math.random() * 7;
          el.style.width = s + 'px';
          el.style.height = s + 'px';
          el.style.left = num(x + rnd(-(spread || 12), spread || 12), 0) + 'px';
          el.style.top = num(y, 0) + 'px';
          el.style.setProperty('--wx', num(rnd(-26, 26), 0) + 'px');
          stage.appendChild(el);
          setTimeout(function () { el.remove(); }, 1250);
        }, i * 70);
      })(i);
    }
  }
  /* 喷潮：从头顶气孔（呼吸孔）喷一串水花。气孔 ≈ 体长 20% 处、背线上方 */
  function blowholePt() {
    var bb = document.querySelector('path.ft-pet-body').getBBox();
    return toWorld(bb.x + bb.width * 0.20, bb.y + 2);
  }
  function spray(n, small) {
    var c = blowholePt();
    wBub(c.x, c.y, n, small ? 5 : 12);
  }
  function mouthBub(n) {
    var c = toWorld(BREEDS[BREED].mouthO.x, BREEDS[BREED].mouthO.y);
    wBub(c.x, c.y, n, 9);
  }

  function moodNow() {
    if (P.stamina < 0.25) return 'tired';
    if (P.bored > 0.62) return 'annoyed';
    if (P.arousal > 0.55) return 'playful';
    if (P.tame > 0.6) return 'attached';
    return 'calm';
  }

  window.ftIslandGo = function () {    /* 菜单点名：游向岛口 */
    if (P.cageIn || P.hidden) return 'busy';
    P.islandGo = true; P.asleep = false; P.restUntil = 0;
    P.tx = clamp(W / 2 - PET_W / 2, bounds().l, bounds().r);
    P.ty = 4;
    return 'ok';
  };
  window.ftIslandOut = function () {   /* 被光标碰到：从岛口窜出来 */
    if (!P.hidden) return 'not-hidden';
    powerWake();                      // 出岛即全速（rest 档在这里点火重启）
    P.asleep = false; P.sleepUntil = 0;
    P.hidden = false; P.islandGo = false;
    P.islandCd = now() + 60000;
    P.islandExitUntil = now() + 1400;  /* 出口宽限：这几帧允许待在顶部 */
    P.x = clamp(W / 2 - PET_W / 2, 14, Math.max(15, W - PET_W - 14));
    P.y = 60; P.vy = 170; P.vx = 0; P.speed = 0;
    P.restUntil = now() + 600;
    spray(8); jolt(-4);
    P.tx = clamp(W / 2 + rnd(-240, 240), 14, Math.max(15, W - PET_W - 14));
    P.ty = clamp(H * 0.55, 16, Math.max(17, H - PET_H - 80));
    return 'ok';
  };
  window.ftSay = function (title, sub, body, ms) { say(title, sub, body, ms); return 'ok'; };

  /* ── 工作哨兵（2.24.0）───────────────────────────────────────────────────
     用户拍的规格：「鱼要知道 dsh 在忙什么、忙完来叫人，但**绝不能抢戏**」。
     于是每一档都先问一句「这会不会烦人」，能省的全省掉：
       busy      —— 只有摆尾加快（render 里那一行），零文字、零位移、零新元素
       done      —— 你人在：一行小字 1.4s，鱼一动不动；睡着/在笼/在岛上时连字都不给
       doneAway  —— 你不在：游到屏幕中部 + 长驻气泡（留到你回来）
       stuck     —— dsh 卡在等你授权：同 doneAway，另加原生一声轻响（仅你不在时）
       idle      —— 你回来了 → 收工：气泡再留 8s 让人来得及看，鱼恢复漫游
     一律只报「跃迁」，绝不重复；原生侧另压两道闸：碎任务（<8s）根本不发这条，
     以及同一次卡顿只喊一次。 */
  function fmtDur(ms) {
    var s0 = Math.round((ms || 0) / 1000);
    if (s0 < 60) return s0 + ' 秒';
    var m = Math.floor(s0 / 60), r = s0 % 60;
    return r ? (m + ' 分 ' + r + ' 秒') : (m + ' 分');
  }
  /* 长驻气泡：复用对答那套视觉（内容型，不受 1.5s「闲话」规矩约束）——
     它报的是工作结果，不是碎嘴。刻意不做成可点的样子：浮层全穿透，
     气泡本来就点不到，别诱导用户去点。 */
  function workBubble(text, ms, pin) {
    hideBubble();
    var el = document.createElement('div');
    el.className = 'ft-dp-bubble ft-dp-work';
    if (env.light) el.setAttribute('data-light', '1');
    el.innerHTML = '<div class="ft-dp-bubble-body">' + esc(text) + '</div>';
    stage.appendChild(el);
    placeBubble(el);
    env.bubble = el;
    env.bubbleUntil = now() + (ms || 4000);
    /* ★ 2.24.0 修：这里原本**无条件**调 pinWhileTalking()（P.tx = P.x）。
       它本意是「说话时鱼别游走」，但叫人动线要的恰恰是**游过去** ——
       刚设好的中部目标被当场覆盖，鱼原地不动、气泡晾在半空，整条动线失效。
       改成：钉不钉由调用方给；不钉的话气泡**跟着鱼走**（见 render 里的跟随）。
       尺寸只测一次存起来：placeBubble 里的 offsetWidth 是强制布局的量，
       每帧读会把「跟随」变成每帧重排 —— 正是刚压下去的那笔开销。 */
    env.bubbleSize = { w: el.offsetWidth || 240, h: el.offsetHeight || 60 };
    env.bubbleFollow = !pin;
    env.bubbleX = -1e9; env.bubbleY = -1e9;
    if (pin) pinWhileTalking();
    return el;
  }
  function isWorkBubble() {
    return !!(env.bubble && env.bubble.className && env.bubble.className.indexOf('ft-dp-work') >= 0);
  }
  /* 叫人动线：游到屏幕中部偏上并停住。在笼里/在岛上不搬动 —— 玻璃罩和岛是它
     自己选的地方，硬把它拽出来比不叫更烦人（那两种情况下只给气泡）。 */
  function comeToMiddle(holdMs) {
    if (P.cageIn || P.hidden) return false;
    P.asleep = false;                   /* 醒着才看得见有人在叫你 */
    P.tx = clamp(W / 2 - PET_W / 2, 14, Math.max(15, W - PET_W - 14));
    P.ty = clamp(H * 0.46, 16, Math.max(17, H - PET_H - 80));
    P.restUntil = now() + holdMs;        /* 到了别再自己游走 */
    P.nextPlay = now() + holdMs;         /* 也别插播节目抢戏 */
    return true;
  }
  window.ftWork = function (mode, ms) {
    mode = String(mode || 'idle');
    if (mode === 'busy') { P.work = 'busy'; return 'busy'; }
    P.work = '';
    if (mode === 'idle') {               /* 你回来了：收工 */
      if (isWorkBubble()) env.bubbleUntil = now() + 8000;
      if (P.restUntil > now()) P.restUntil = 0;
      if (P.nextPlay > now()) P.nextPlay = now() + 3000;
      return 'idle';
    }
    if (mode === 'done') {               /* 你人在：一行小字，鱼不动 */
      if (P.asleep || P.cageIn || P.islandGo || P.drag) return 'quiet';
      workBubble('活干完了 · ' + fmtDur(ms), 1400, true);
      blowSparks(2);
      return 'done';
    }
    if (mode === 'doneAway') {
      /* 顺序要紧：先建气泡（pin=false → 不钉住鱼）再定目标。
         反过来写的话，workBubble 里的 pinWhileTalking 会把刚设的目标盖掉。 */
      workBubble('活干完了 · ' + fmtDur(ms), 20 * 60000, false);
      var moved = comeToMiddle(20 * 60000);
      if (moved) { spray(4); blowSparks(3); }
      return moved ? 'doneAway' : 'doneAwayStill';
    }
    if (mode === 'stuck') {
      workBubble('它停下来等你了', 20 * 60000, false);
      var m2 = comeToMiddle(20 * 60000);
      if (m2) { spray(3); blowSparks(3); }
      return 'stuck';
    }
    return 'idle';
  };

  /* ── 鱼的对答（2.19.0）：麦克风 chip + native 下行通道 ─────────────────────
     链路：chip 点击 → report('fishMic') → 原生借 VoiceEngine 收音 → partial/电平
     打回这里（转写进气泡、电平进波形条）→ 判停定稿送网页版 → 回复经 reply() 进长驻气泡。
     对答气泡是**内容型**，不受 say() 的 1.5s 上限约束（用户 1.5s 规矩管的是它的闲言碎语）。 */
  var FS = { state: 'idle', partial: '' };
  var micEl = (function () {
    var m = document.createElement('div');
    m.className = 'ft-dp-mic';
    if (env.light) m.setAttribute('data-light', '1');
    m.setAttribute('data-state', 'idle');
    m.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z"/></svg>'
      + '<span class="ft-dp-mic-label">对答</span>'
      + '<i></i><i></i><i></i><i></i>'
      + '<span class="ft-dp-mic-dots"><i></i><i></i><i></i></span>';
    m.addEventListener('click', function (e) {
      e.stopPropagation();
      report('fishMic', { op: FS.state === 'listening' ? 'cancel' : 'start' });
    });
    m.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    stage.appendChild(m);
    return m;
  })();

  /* ── 长按轮盘（2.20.0）：按住鱼身 850ms 呼出 ──────────────────────────────
     用户定的四项：聊天（=原麦克风 chip 的入口）/ 回笼 / 上岛 / 换肤。
     chip 平时收进轮盘（placeMic 只在会话进行中现身），平时想点中一条游动的鱼
     上的小按钮太难 —— 轮盘把入口收敛到「按住鱼」这个最大的目标上。 */
  var wheelEl = (function () {
    var w = document.createElement('div');
    w.className = 'ft-dp-wheel';
    if (env.light) w.setAttribute('data-light', '1');
    var ICONS = {
      chat: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z"/></svg>',
      cage: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1H5.06A7 7 0 0 1 12 5a7 7 0 0 1 6.94 7H17a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z"/></svg>',
      island: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 5c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8zm0 13.4A5.4 5.4 0 1 1 17.4 13 5.4 5.4 0 0 1 12 18.4zm0-8.4a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/></svg>',
      skin: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A4.6 4.6 0 0 0 22 9.8C21.4 5.9 17 3 12 3zM6.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3.5 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>'
    };
    var ITEMS = [
      { act: 'chat',   label: '聊天' },
      { act: 'cage',   label: '回笼' },
      { act: 'island', label: '上岛' },
      { act: 'skin',   label: '换肤' }
    ];
    for (var i = 0; i < ITEMS.length; i++) {
      var it = document.createElement('div');
      it.className = 'ft-dp-wheel-item';
      it.setAttribute('data-act', ITEMS[i].act);
      /* -135° 起顺时针均布：聊天在上、回笼右、上岛下、换肤左。
         --wx/--wy = 本片的圆周坐标，供 closed 态「吸回鱼心」的 transform 用；
         弹出阶梯 delay 走 CSS nth-child（只在 [data-on] 态生效）。 */
      var ang = (-135 + i * 90) * Math.PI / 180;
      var wx = Math.round(Math.cos(ang) * 62) + 'px', wy = Math.round(Math.sin(ang) * 62) + 'px';
      it.style.left = wx;
      it.style.top = wy;
      it.style.setProperty('--wx', wx);
      it.style.setProperty('--wy', wy);
      it.innerHTML = ICONS[ITEMS[i].act] + '<span>' + ITEMS[i].label + '</span>';
      it.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      it.addEventListener('click', function (e) {
        e.stopPropagation();
        var act = e.currentTarget.getAttribute('data-act');
        wheelClose();
        if (act === 'chat') { report('fishMic', { op: FS.state === 'listening' ? 'cancel' : 'start' }); }
        else if (act === 'cage') { if (window.ftCageToggle) window.ftCageToggle(); }
        else if (act === 'island') { if (window.ftIslandGo) window.ftIslandGo(); }
        else if (act === 'skin') {
          var ks = Object.keys(BREEDS);
          var nx = ks[(ks.indexOf(BREED) + 1) % ks.length];
          if (window.ftBreed(nx)) say('换造型', BREEDS[nx].name || nx, '', 1500);
        }
      });
      w.appendChild(it);
    }
    stage.appendChild(w);
    return w;
  })();

  function wheelOpen() {
    if (P.menuOpen || P.hidden) return;
    P.menuOpen = true;
    var cx = P.x + PET_W * (P.scale || 1) / 2, cy = P.y + PET_H * (P.scale || 1) / 2;
    wheelEl.style.left = Math.round(cx) + 'px';
    wheelEl.style.top = Math.round(cy) + 'px';
    wheelEl.setAttribute('data-on', '1');
    P.tx = P.x; P.ty = P.y;                     /* 轮盘开着：钉在原地 */
    P.restUntil = now() + 60000;
    P.petting = false;                          /* 长按先摸了两下 → 转入轮盘 */
    report('wheel', { on: 1 });
  }
  function wheelClose() {
    if (!P.menuOpen) return;
    P.menuOpen = false;
    wheelEl.removeAttribute('data-on');
    if (!P.cageIn) P.restUntil = 0;
    report('wheel', { on: 0 });
  }

  function chatSay(text, ms) {          /* 对答气泡：听写转写 / 思考 / 回复 / 出错共用 */
    hideBubble();
    var el = document.createElement('div');
    el.className = 'ft-dp-bubble';
    if (env.light) el.setAttribute('data-light', '1');
    el.innerHTML = '<div class="ft-dp-bubble-body">' + esc(text) + '</div>';
    stage.appendChild(el);
    placeBubble(el);
    env.bubble = el;
    env.bubbleUntil = now() + (ms || 9000);
    pinWhileTalking();
  }

  function setFishState(s) {
    FS.state = s; FS.partial = '';
    micEl.setAttribute('data-state', s);
    if (s === 'listening') {
      P.asleep = false;
      P.restUntil = now() + 35000;      /* 听的时候别游走（看门狗 30s 内一定收摊） */
      env.chatHold = true;
      if (env.bubble) env.bubbleUntil = now() + 60000;   /* 上一条回复给新会话让位前先挂住 */
    } else if (s === 'thinking') {
      P.restUntil = now() + 90000;      /* 等网页版回话：钉在原地 */
      if (env.bubble) env.bubbleUntil = now() + 90000;   /* 你的转写继续挂住 */
      env.chatHold = true;
    } else {
      if (env.chatHold) { hideBubble(); env.chatHold = false; }
      if (!P.cageIn) P.restUntil = 0;
    }
  }

  window.__ftFish = {
    state: function (s) { setFishState(String(s || 'idle')); },
    partial: function (t) {             /* 实时转写：说一个字长一个字 */
      if (FS.state !== 'listening') return;
      FS.partial = String(t || '');
      if (FS.partial) chatSay(FS.partial, 60000);
      else if (env.chatHold) hideBubble();
    },
    levels: function (arr) {            /* 电平 → 波形条高度（28 桶取 4 桶） */
      if (!arr || !arr.length || FS.state !== 'listening') return;
      var bars = micEl.querySelectorAll(':scope > i');
      for (var k = 0; k < bars.length; k++) {
        var v = arr[Math.min(arr.length - 1, Math.floor(k * arr.length / bars.length))] || 0;
        bars[k].style.height = Math.max(2.5, Math.min(16, 3 + v * 52)) + 'px';
      }
    },
    reply: function (t) {
      setFishState('idle');
      if (t) { chatSay(String(t), 10000); blowHearts(3); }
    },
    error: function (m) { setFishState('idle'); if (m) chatSay(String(m), 6000); },
    notice: function (m) { setFishState('idle'); if (m) chatSay(String(m), 5000); }
  };
  window.ftMicState = function () { return { state: FS.state, partial: FS.partial }; };  /* 探针用 */

  function placeMic(t) {                /* 会话进行中才现身（2.20.0：入口收进轮盘） */
    if (P.hidden || FS.state === 'idle') { micEl.removeAttribute('data-on'); return; }
    micEl.setAttribute('data-on', '1');
    var w = micEl.offsetWidth || 58, h = micEl.offsetHeight || 24;
    var mx = clamp(P.x + PET_W / 2 - w / 2, 8, Math.max(8, W - w - 8));
    var my = clamp(P.y + PET_H * (P.scale || 1) + 10, 8, Math.max(8, H - h - 8));
    micEl.style.left = num(mx) + 'px';
    micEl.style.top = num(my) + 'px';
  }

  /* 把鲸鱼摆到指定位置并**停住**：目标设成自身 + 长休息。
     自检/截图要用它做定点 —— 否则鲸鱼一直在游，测试算好的坐标等回来早就不是它了
     （第一版穿透自检就是这么假红的：读坐标与搬鼠标之间隔了 0.7s，它已经游走 80px）。 */
  window.ftPlace = function (x, y) {
    powerWake();
    P.x = clamp(num(x, W * 0.6), bounds().l, bounds().r);
    P.y = clamp(num(y, H * 0.7), bounds().t, bounds().b);
    P.tx = P.x; P.ty = P.y;
    P.vx = 0; P.vy = 0; P.speed = 0;
    P.restUntil = now() + 120000;
    return 'ok';
  };
  window.ftRoam = function () { P.restUntil = 0; pickTarget(); return 'ok'; };
  /* 定向游向某点（给「看家」「凑过来」这类场景用，自检也靠它制造转身）*/
  window.ftSwimTo = function (x, y) {
    powerWake();
    P.tx = clamp(num(x, P.x), bounds().l, bounds().r);
    P.ty = clamp(num(y, P.y), bounds().t, bounds().b);
    P.restUntil = now() + 60000;
    return 'ok';
  };
  /* 强制眨一次眼 —— 眨眼是随机间隔的，自检不能靠等（等不到就是假红）*/
  window.ftBlink = function () { P.blink = 0.08; P.nextBlink = now() + 4000; return 'ok'; };
  window.ftSleep = function (on) {
    powerWake();
    P.asleep = !!on; P.blink = on ? 0.06 : 1; P.sleepUntil = 0;
    return 'ok';
  };
  /* 功率档位（2.23.0）：原生可强制 'full' / 'eco' / 'rest'（自检与实测核对用）。
     2.23.7 起页面**不再自动降档**（桌面上的鱼全程 full），所以这道门从「外部插手」
     变成了「手动总闸」—— 保留给自检与实测（例如想复核 eco 档的节流是否仍有效）。 */
  window.ftPower = function (level) {
    if (level === 'full') powerWake();
    else if (level === 'eco' || level === 'rest') powerSet(level);
    return POWER.level;
  };
  window.ftCelebrate = function () {
    blowSparks(12);
    startAct('leap', now());                  // 旧鲸鱼式庆祝：跃出水面 + 喷潮 + 涟漪
    say('完成了', '', '', 2600);
    P.tame = Math.min(1, P.tame + 0.01);
    return 'ok';
  };
  window.ftPlay = function (m) { startAct(m || 'spout', now()); return P.mode; };
  /* 测试闸门：关掉自主节目调度（稳定性门禁要在「无随机表演」前提下量运动品质）*/
  window.ftCalm = function (on) { P._calm = !!on; return 'ok'; };
  /* 靠近即停（2.20.0）：原生 30Hz 轮询发现鼠标距鱼命中矩形 < 72px 时推 true。
     冻结 = 帧循环 holdStill 门（不派新漫游目标）+ 进场瞬间目标设成自身（减速靠站）。
     语义：人想点它 / 呼轮盘时，它停好等着，不再跟人玩「追我啊」。 */
  window.ftNear = function (on, moved) {
    on = !!on;
    /* 2.23.4：第二个参数 = 原生侧判定的「指针真的在动」。只有「靠近 **且** 人真的在动鼠标」
       才算用户在场 —— 否则鱼自己游过一支静止的鼠标就会 powerWake()，桌面鱼永远回不到 eco
       （实测档位 full→eco 三秒后即被 eco→full 抵消，长期停在 full=12.8% 单核）。
       省略第二个参数时按 true 处理，兼容旧的单参数调用。 */
    moved = (moved === undefined) ? true : !!moved;
    if (on && moved) powerWake();
    if (on === !!P.near) return 'same';
    P.near = on;
    if (on && !P.drag && !P.islandGo && !P.hidden && !P.cageIn) { P.tx = P.x; P.ty = P.y; }
    return 'ok';
  };
  /* 换造型：三款共用骨骼，切完立刻重建（自检/尝鲜用）*/
  window.ftBreed = function (n) {
    if (!BREEDS[n]) return 'unknown:' + n;
    BREED = n;
    build();
    return BREEDS[n].name;
  };
  window.ftState = function () {
    return {
      ok: true, breed: BREED, x: Math.round(P.x), y: Math.round(P.y),
      /* x1/y1 = 0.1px 精度。**验"有没有在抽动"必须看它，不能看取整后的 x**：
         鲸鱼停在半像素位置时，尾数在 .5 边界上来回翻，x 会 40/41/40/41 地跳，
         看着像"反复折返"，其实一点没动（2026-09-22 实测：摆幅 1px 折返 5 次）。 */
      x1: Math.round(P.x * 10) / 10, y1: Math.round(P.y * 10) / 10,
      mode: P.drag ? 'drag' : (P.asleep ? 'asleep' : 'roam'),
      asleep: !!P.asleep,
      /* 行为系统快照（沿用旧鲸鱼 v4 的内部状态，供诊断/自动化断言）*/
      act: P.mode, lastPlay: P.lastPlay,
      stamina: Math.round(P.stamina * 100) / 100,
      arousal: Math.round(P.arousal * 100) / 100,
      bored: Math.round(P.bored * 100) / 100,
      mood: P.mood, tame: Math.round(P.tame * 1000) / 1000,
      petting: !!P.petting, attn: P.attn,
      speed: Math.round(P.speed), heading: Math.round(P.heading * 57.3),
      flip: Math.round(P.flip * 1000) / 1000,
      face: P.face, fst: Math.round(clamp(P.speed / 130, 0, 1) * 100) / 100,
      pitch: Math.round(P.pitch * 10) / 10, sway: Math.round(P.sway * 100) / 100,
      tailHz: Math.round((P.tailF || (0.55 + clamp(P.speed / 130, 0, 1) * 2.00)) * 100) / 100,
      tgt: { x: Math.round(P.tx), y: Math.round(P.ty) },
      chewing: !!P.chewing, bubble: !!env.bubble, fps: Math.round(fps),
      power: POWER.level, work: P.work || '', idleSec: Math.round((now() - POWER.idleAt) / 1000),
      powerLog: powerLog.slice(-6).join(' '),
      belly: P.bellyN | 0, bellyChip: P.bellyChip || '',
      cageIn: !!P.cageIn, cageWant: !!cage.want, hidden: !!P.hidden,
      playdead: !!P.playdead, scale: P.scale || 1, islandGo: !!P.islandGo,
      near: !!P.near, menu: !!P.menuOpen, chat: FS.state,
      hopY: Math.round(P.hopY * 10) / 10, hopV: Math.round(P.hopV),
      /* 呼吸辉光的实际透明度（探针用：验证「光晕随呼吸明暗」真的在动） */
      halo: haloEl ? Math.round((parseFloat(haloEl.style.opacity) || 0) * 100) / 100 : -1,
      w: PET_W, h: PET_H, bounds: bounds(), sw: W, sh: H,
      /* 造型指标一起上报：真机日志里直接能看到"这只的体长比/眼占比/胸鳍露出"，
         不用再靠截图量。PETRIG.audit 有违反时 rigBad 非空。 */
      rig: PETRIG.report(BREEDS), rigBad: PETRIG.audit(BREEDS).join(' ; ')
    };
  };

  /* ── 鼠标位置（窗口级穿透由原生负责，这里只要坐标做「看你」）──────────── */
  document.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX; mouse.y = e.clientY;
    mouse.active = true; mouse.at = now();      // 见「凑过来看你」规矩 ①
    if (env.bubble && now() > env.bubbleUntil) hideBubble();
  }, { passive: true });

  /* ── 拖放接收 ───────────────────────────────────────────────────────────
     macOS WKWebView 支持 HTML5 拖放：dragover 必须 preventDefault 才会来 drop。
     文件内容全在本机读（FileReader），不经过任何网络。 */
  var dragDepth = 0;
  function onDragEnter(e) { e.preventDefault(); dragDepth++; window.ftDragHover(true); }
  function onDragOver(e) {
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'copy'; } catch (err) {}
    if (mouse.active) { mouse.x = e.clientX; mouse.y = e.clientY; }
  }
  function onDragLeave(e) {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) window.ftDragHover(false);
  }
  function onDrop(e) {
    e.preventDefault();
    dragDepth = 0;
    window.ftDragHover(false);
    var dt = e.dataTransfer;
    if (!dt) { say('没接到', '', '拖放数据是空的', 2600); return; }
    var files = dt.files;
    if (files && files.length) {
      handleFile(files[0]);
      if (files.length > 1) {
        setTimeout(function () { say('还有 ' + (files.length - 1) + ' 个', '', '我一次只吃一个，先尝了这个', 3000); }, 1600);
      }
      return;
    }
    var txt = dt.getData('text/plain') || dt.getData('text');
    if (txt) { feed({ kind: 'text', name: '一段文字', text: txt, len: txt.length, size: txt.length, from: 'drop' }); return; }
    say('没接到', '', '这个格式我还不认识', 2600);
  }
  function handleFile(f) {
    var name = f.name || '未命名';
    var mime = f.type || '';
    if (mime.indexOf('image/') === 0) {
      var fr = new FileReader();
      fr.onload = function () { feed({ kind: 'image', name: name, size: f.size, mime: mime, dataUrl: fr.result, from: 'drop' }); };
      fr.onerror = function () { feed({ kind: 'file', name: name, size: f.size, mime: mime, hint: '图片读不出来', from: 'drop' }); };
      fr.readAsDataURL(f);
      return;
    }
    var texty = /^(text\/|application\/(json|xml|javascript|x-sh|yaml|toml))/.test(mime) ||
                /\.(txt|md|markdown|json|ya?ml|toml|js|ts|tsx|jsx|py|swift|go|rs|java|c|h|cpp|css|html?|sh|zsh|sql|log|csv|ini|conf|env)$/i.test(name);
    if (texty) {
      var fr2 = new FileReader();
      fr2.onload = function () {
        var txt = String(fr2.result || '');
        feed({ kind: 'text', name: name, size: f.size, mime: mime || 'text', text: txt, len: txt.length, from: 'drop' });
      };
      fr2.onerror = function () { feed({ kind: 'file', name: name, size: f.size, mime: mime, hint: '读不出来', from: 'drop' }); };
      fr2.readAsText(f);
      return;
    }
    feed({ kind: 'file', name: name, size: f.size, mime: mime || '二进制文件', hint: '我含住了，还没学会怎么读它', from: 'drop' });
  }

  document.addEventListener('dragenter', onDragEnter, false);
  document.addEventListener('dragover', onDragOver, false);
  document.addEventListener('dragleave', onDragLeave, false);
  document.addEventListener('drop', onDrop, false);
  // 拖放期间浏览器默认会打开文件 —— 全屏兜住
  window.addEventListener('dragover', function (e) { e.preventDefault(); }, false);
  window.addEventListener('drop', function (e) { e.preventDefault(); }, false);

  petEl.addEventListener('pointerdown', petDown);
  petEl.addEventListener('pointermove', petMove);
  petEl.addEventListener('pointerup', petUp);
  petEl.addEventListener('pointercancel', function (e) {
    if (P.lpTimer) { clearTimeout(P.lpTimer); P.lpTimer = 0; }
    P.drag = false; petEl.style.cursor = 'grab';
    try { petEl.releasePointerCapture(e.pointerId); } catch (err) {}
  });
  petEl.addEventListener('dblclick', petDbl);
  /* 轮盘外点收盘：条目自己 stopPropagation 了；按鱼身走 petDown 里的收盘 */
  document.addEventListener('pointerdown', function (e) {
    if (P.menuOpen && wheelEl && !wheelEl.contains(e.target)) wheelClose();
  }, true);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && P.menuOpen) wheelClose();
  });
  petEl.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    /* 右键 = 咽下去：清空鲸腹（不想留的东西直接消化掉）*/
    if ((P.bellyN | 0) > 0) {
      try { window.webkit.messageHandlers.fatiaowuPet.postMessage({ kind: 'bellyClear', data: {} }); } catch (err) {}
      window.ftBelly(0, '', '');
      var c = toWorld(BREEDS[BREED].mouthO.x, BREEDS[BREED].mouthO.y);
      ripple(c.x, c.y);
      blowSparks(3);
      say('咕嘟', '咽下去了', '肚子空了', 2400);
      report('bellyClear', {});
    }
  });

  window.addEventListener('resize', function () {
    W = window.innerWidth; H = window.innerHeight;
    clampInside();
  });

  build();
  requestAnimationFrame(frame);
  // 就绪信号（原生侧自检盯这行）
  try { window.webkit.messageHandlers.fatiaowuPet.postMessage({ kind: 'ready', data: { w: W, h: H } }); } catch (e) {}
})();
</script>
</body>
